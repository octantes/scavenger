    disconnectedCallback() { // do not reset _wired - listeners persist across remove + re-insert, re-adding them would double-fire
      if (this._customTeardown) { this._customTeardown(); this._customTeardown = null; }
      clockUnregister(this);
      onUnregister(this);
      this._disconnect?.(); // quest kills retry chain + drops its scrape, variable frees its store binding - set by their setups
    }

    emit(value) { splitWords(this.getAttribute('data-scv-emits')).forEach(ch => routeSend(ch, value)); }

    _ensureEmitChannel(prefix) { // seeds random own channel so node can emit before any cable is wired - never overwrites wiring
      if (!this.getAttribute('data-scv-emits')) this.setAttribute('data-scv-emits', 'ch_' + prefix + '_' + uid(6));
    }

    _output(value) { // display + propagate: shared result tail of built-in nodes
      this._showFloat(value);
      this.emit(value);
    }

    _showFloat(value) { // transient floating value overlay - create-or-update, fades to visible
      let el = this.querySelector('.scv-logic-float');
      if (!el) { el = document.createElement('div'); el.className = 'scv-logic-float'; this.appendChild(el); }
      el.textContent = value;
      el.style.opacity = '1';
      clearTimeout(el._hideTimer);
      el._hideTimer = setTimeout(() => { el.style.opacity = '0'; }, 600);
    }

    _flashError(where, err) { // logs thrown code/expressions and flash red border
      console.warn('scv-logic', this.dataset.type, where + ':', err);
      this.classList.add('scv-node-error');
      clearTimeout(this._errTimer);
      this._errTimer = setTimeout(() => { this.classList.remove('scv-node-error'); }, 1500);
    }
  });
}

// undo system

function pushUndo(forward, backward, label) { // store a do/undo pair in stack (forward = redo, backward = undo)
  session.undoStack.length = session.undoPos + 1; // a new action forks history: drop any redo tail first
  session.undoStack.push({ forward, backward, label });
  if (session.undoStack.length > UNDO_MAX) session.undoStack.shift(); // at cap, shift drops oldest
  else session.undoPos++; // else advance it
}

function undo() { // replay current action's backward arrow and step back
  if (session.undoPos < 0) return;
  session.undoStack[session.undoPos].backward();
  session.undoPos--;
}

function redo() { // replay next action's forward arrow and step forward
  const nextPos = session.undoPos + 1;
  if (nextPos >= session.undoStack.length) return;
  session.undoStack[nextPos].forward();
  session.undoPos++;
}

function cancelActiveDrag() { // release capture, hide temp wire, drop drag state - no-op if idle
  if (!session.activeDrag) return;
  const { captureTarget, pointerId } = session.activeDrag;
  if (captureTarget) { try { captureTarget.releasePointerCapture(pointerId); } catch { console.warn('releasePointerCapture failed'); } }
  tempWire.classList.add('hidden');
  session.activeDrag = null;
}

function resetChainIf(el) { // cancel pending chain if el is its source, and hide temp wire
  if (el !== session.lastSpawned) return;
  session.isChainPending = false; session.lastSpawned = null; tempWire.classList.add('hidden');
}

function clearHoverIf(el) { // deleting hovered node must drop dim state it owns, or cables stay dimmed until pointer moves

}

function deleteElementWithUndo(el, chainEl = el) { // delete an element with undo - reinserts subtree and renderCables re-wires
  cancelActiveDrag();
  resetChainIf(chainEl);
  clearHoverIf(el);
  deselectEl(el);
  updateSelectionDim();
  const parentEl = el.parentNode, nextEl = el.nextSibling;
  unobserveHostGeometry(el);
  el.remove();
  renderCables();
  invalidateCache();
  pushUndo(
    () => { unobserveHostGeometry(el); el.remove(); invalidateCache(); renderCables(); },
    () => { // nextEl may itself have been removed since (a later, unrelated delete) - insertBefore(el, null) is just appendChild
      parentEl.insertBefore(el, nextEl && nextEl.parentNode === parentEl ? nextEl : null);
      clearCachesIn(el); observeHostGeometry(el); selectEl(el); updateSelectionDim(); invalidateCache(); renderCables();
    },
    'delete'
  );
}

function deleteSelected() { // snapshot and remove selected nodes/wrappers - undo restores exact dom order
  const items = [];
  selectedEls().forEach(el => { // build undo snapshot list: cancels pending, deselects and snapshots each
    const isLogic = el.tagName === 'SCV-LOGIC';
    resetChainIf(isLogic ? el : el.querySelector('[data-scv-id]'));
    clearHoverIf(el);
    deselectEl(el);
    items.push({ el, parent: el.parentNode, next: el.nextSibling });
  });
  // sort to doc order - undo callback re-inserts in reverse before each saved nextSibling (which only works in doc order)
  items.sort((a, b) => (a.el.compareDocumentPosition(b.el) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);
  updateSelectionDim();
  if (items.length === 0) return;
  cancelActiveDrag();
  items.forEach(item => unobserveHostGeometry(item.el));
  items.forEach(item => item.el.remove());
  renderCables();
  invalidateCache();
  pushUndo(
    () => { // re-remove restored items
      items.forEach(item => unobserveHostGeometry(item.el));
      items.forEach(item => item.el.remove());
      invalidateCache();
      renderCables();
    },
    () => { // re insert in reverse to restore document order - reverse handles adj deletions
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        if (item.next && item.next.parentNode === item.parent) item.parent.insertBefore(item.el, item.next);
        else item.parent.appendChild(item.el);
      }
      items.forEach(item => { observeHostGeometry(item.el); clearCachesIn(item.el); selectEl(item.el); });
      updateSelectionDim(); // undo restores selection it deleted, so dimming matches
      invalidateCache();
      renderCables();
    },
    'delete ' + items.length
  );
}

const WHEN_DEFINED_TIMEOUT = 5000;

  let cap;

    new Promise(r => { cap = setTimeout(r, ms ?? WHEN_DEFINED_TIMEOUT); }),

function hydrateComponentShadow(el) { // hydrate a component's shadow from its frozen template (once defined or timed out)
  if (!el || !el.tagName) return;

    : [...root.querySelectorAll('[data-scv-id]:not(scv-logic)')];

function defineScavNode(def) { // register/replace a custom node type + re-point existing instances at new def
  const cls = customElements.get('scv-logic');

  if (existing && !existing.custom) { console.warn('scv node def: "' + def.name + '" is a reserved built-in name - ignored'); return; } // clock/gate/quest must not be overwritten
  if (def.name === '__proto__' || /["\]]/.test(def.name)) { console.warn('scv node def: "' + def.name + '" is not a safe type name - ignored'); return; } // __proto__ would retarget type table; " and ] break re-point selector
  cls.nodeTypes[def.name] = {
    icon: def.icon || '◆',
    val: def.defaultVal != null ? String(def.defaultVal) : '',
    color: def.color || 'var(--input)',
    placeholder: def.placeholder || '',
    openWidth: def.openWidth ?? 0,
    label: def.label || '',

    if (old._customReady) {

      const input = old.querySelector('.scv-logic-input');
      if (icon) icon.textContent = def.icon || '◆'; // modes (if any) override this
      old._setupCustom(icon, input, def);
    } else {
      const fresh = document.createElement('scv-logic');
      for (const a of old.attributes) fresh.setAttribute(a.name, a.value);
      const oldInput = old.querySelector('input');

      wrapper.style.left = (baseX + offX) + 'px';
      wrapper.style.top = (baseY + offY) + 'px';
      if (item.scale) wrapper.style.scale = item.scale;
      if (item.zIndex) wrapper.style.zIndex = item.zIndex;
      const el = document.createElement(item.tag);
      applyAttrs(el, item.attrs, newId);
      _remapWire(el, channelMap); // host-level wiring
      if (shadowDom[i]) { // remap captured shadow's wiring, then carry as frozen template so hydrate applies this state

      wrapper.prepend(el);

          _remapWire(node, channelMap); // internal wires > fresh channels; dangling dropped before connect
          _stripSelfSeedChannels(node);
          if (rl.left) node.style.left = rl.left;
          if (rl.top) node.style.top = rl.top;
          wrapper.appendChild(node);
          if (rl.value != null) {

          }

      zoomLayer.appendChild(wrapper);
      if (item.script && !injectedScripts.has(item.tag) && !customElements.get(item.tag)) {
        const s = document.createElement('script');
        s.setAttribute('data-scv-def', 'true');
        s.setAttribute('data-scv-tag', item.tag);
        s.textContent = item.script;
        document.body.appendChild(s);
        injectedScripts.add(item.tag);
      }

      reframeHarvestedNodes(wrapper, el);

  created.forEach(el => { (el.tagName === 'SCV-LOGIC' ? el : (el.querySelector('[data-scv-id]') || el)).offsetHeight; });
  invalidateCache();
  clearSelection();
  created.forEach(el => { selectEl(el); clearCachesIn(el); });
  updateSelectionDim();
  renderCables();
  requestAnimationFrame(renderCables); // sub-el cables live in async-hydrated shadows, so re-derive once settled
  pushUndo(
    () => {
      created.forEach(el => zoomLayer.appendChild(el)); // re-append keeps attrs across remove + re-add, redo needs no re-wire
      // force layout before measuring (like initial paste) so renderCables draws from real geometry, not pre-layout box
      created.forEach(el => { (el.tagName === 'SCV-LOGIC' ? el : (el.querySelector('[data-scv-id]') || el)).offsetHeight; });
      created.forEach(el => clearCachesIn(el));
      invalidateCache();
      renderCables();
    },
    () => { created.forEach(el => { el.remove(); invalidateCache(); renderCables(); }); },
    'paste-selected'

}

const GRID_STEP = 24, GRID_HALF = GRID_STEP / 2; // css centers dot inside 24px tile, so lattice sits half a cell in
const snapAxis = v => Math.round((v - GRID_HALF) / GRID_STEP) * GRID_STEP + GRID_HALF; // lands dead on dot centre
const snapAnchor = d => { // node rides dot by icon center - same point cables leave from, open and closed agree
  if (d.type !== 'logic-move') return [0, 0]; // component hangs corner there instead
  const ic = d.wrapper?.querySelector?.('.scv-logic-icon') || d.wrapper;
  return [(ic?.offsetWidth || 0) / 2, (ic?.offsetHeight || 0) / 2];
};

function nudgeSelected(dx, dy, snap) { // arrow-key move: one undo step per press, like backspace/delete's granularity
  const targets = selectedEls();
  if (!targets.length) return;
  const before = targets.map(el => ({ el, x: px(el, 'left'), y: px(el, 'top') })); // captured once - forward/backward both apply from here
  if (snap) { // cell step pull off-lattice selection onto lattice, not just 24px along
    if (dx) dx = snapAxis(before[0].x + dx) - before[0].x;
    if (dy) dy = snapAxis(before[0].y + dy) - before[0].y;
  }
  const apply = (ddx, ddy) => {
    before.forEach(t => { t.el.style.left = (t.x + ddx) + 'px'; t.el.style.top = (t.y + ddy) + 'px'; clearCachesIn(t.el); });
    invalidateCache();
    renderCables();
  };
  apply(dx, dy);
  pushUndo(() => apply(dx, dy), () => apply(0, 0), 'nudge');
}

function setMode(mode) { // change mode: toggle chrome, host edit-attrs, cable canvas, empty-state hint
  const switching = mode !== session.mode; // most callers (paste/harvest/number-spawn) call this unconditionally - only an actual edit<->use switch may tear down an in-progress chain
  clearSelection();
  if (switching) { session.isChainPending = false; session.lastSpawned = null; session.ctxLockDir = null; } // chain state never crosses a real mode switch, but a redundant same-mode call must not wipe it mid-gesture
  session.chainHoverNode = null; tempWire.classList.add('hidden');
  canvasContainer.className = mode === 'use' ? '' : `mode-${mode}`; // class is mode (session.mode derives from it)
  // sync each host's data-scv-edit attr (shadow hover styles key off it; firefox WONTFIXes :host-context, so shadow can't read mode)
  const syncEditAttr = (root, sel) => {
    root.querySelectorAll(sel).forEach(h => h.toggleAttribute('data-scv-edit', mode === 'edit'));
    root.querySelectorAll('*').forEach(n => { if (n.shadowRoot) syncEditAttr(n.shadowRoot, '[data-scv-id]'); }); // nested hosts inside shadow dom too - no .comp-wrapper ancestor in there
  };
  syncEditAttr(document, '.comp-wrapper [data-scv-id]');

  if (mode === 'edit') {
    wireCanvas.classList.remove('hidden');
    renderCables();
    canvasContainer.addEventListener('pointerover', onNodeOver);
    canvasContainer.addEventListener('pointerout', onNodeOut);
  } else {
    restoreNodeOpacity();
    canvasContainer.removeEventListener('pointerover', onNodeOver);
    canvasContainer.removeEventListener('pointerout', onNodeOut);
    wireCanvas.classList.add('hidden');
    tempWire.classList.add('hidden');
    tooltip.style.display = 'none'; // wiring hover-tag is edit-only, don't leave it stuck when leaving edit
  }

  refreshWorkshopChrome(); // empty-state hint + bg picker are edit-only
  if (mode === 'edit') updateGrid(); // sync dot field to current zoom/pan on entry
}

function expandHex(h) { // expand #abc to get a 6-digit value
  const m = /^#([0-9a-f]{3})$/i.exec(h);
  return m ? '#' + m[1].split('').map(c => c + c).join('').toLowerCase() : (h || '').toLowerCase();
}

function hexLuminance(hex) { // compute relative luminance (0-1) of a hex, for dark/light grid-dot choice
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return 0.1;
  const n = parseInt(m[1], 16);
  return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
}

function applyGridForBg(hex) { // pick grid dot color to suit background luminance (a step off any surface)

// canvas viewport (zoom, scroll extent, z-order)

function expandCanvasWidth(scrollLeft) { // grow zoom layer min-width (+padding) to prevent hitting hard edge
  zoomLayer.style.minWidth = (scrollLeft + canvasContainer.clientWidth + CANVAS_SCROLL_EXPAND_AMOUNT) + 'px';
}

function expandCanvasHeight(scrollTop) { // grow zoom layer min-height (+padding) to prevent hitting hard edge
  zoomLayer.style.minHeight = (scrollTop + canvasContainer.clientHeight + CANVAS_SCROLL_EXPAND_AMOUNT) + 'px';
}

function setZoom(newZoom, cx, cy) { // zoom canvas (cx,cy) clamped 0.1-5 keeps point fixed
  const oldZoom = session.zoom;
  newZoom = Math.max(0.1, Math.min(5, newZoom));
  if (newZoom === oldZoom) return;
  const docX = (cx + canvasContainer.scrollLeft) / oldZoom;
  const docY = (cy + canvasContainer.scrollTop) / oldZoom;
  const newSL = Math.max(0, newZoom * docX - cx), newST = Math.max(0, newZoom * docY - cy); // clamp - near origin negative scroll is clamped by browser and anchor drifts
  if (newSL > canvasContainer.scrollWidth - canvasContainer.clientWidth) {
    expandCanvasWidth(newSL);
  }
  if (newST > canvasContainer.scrollHeight - canvasContainer.clientHeight) {
    expandCanvasHeight(newST);
  }
  session.zoom = newZoom;
  zoomLayer.style.transform = 'scale(' + newZoom + ')';
  canvasContainer.scrollLeft = newSL;
  canvasContainer.scrollTop = newST;
  updateGrid(); // re-space dot field to new zoom
}

function normalizeZIndex() { // repack z-index into two bands: components below cables, logic nodes above
  const pack = (sel, base) => [...zoomLayer.querySelectorAll(sel)] // two reserved bands, cables sit between them
    .map(el => ({ el, z: parseInt(window.getComputedStyle(el).zIndex) || 1 }))
    .sort((a, b) => a.z - b.z)
    .forEach((item, i) => item.el.style.zIndex = base + i);
  pack('.comp-wrapper', 1);
  pack('scv-logic', 100);
}

// wiring engine

// recurse into every shadow root under root
function forEachShadow(root, fn) { root.querySelectorAll('*').forEach(n => { if (n.shadowRoot) fn(n.shadowRoot); }); }

function clearCachesIn(wrp) { // drop cached center/dims for every wired element in a subtree (and its shadows)
  if (!wrp || !wrp.querySelectorAll) return;
  const sel = '[' + ATTR_EMITS + '],[' + ATTR_RECEIVES + '],[' + ATTR_ACTION + ']';
  const walk = (root) => {
    if (!root || !root.querySelectorAll) return;
    if (root.matches?.(sel)) { _nodeCenters.set(root, null); _nodeDims.set(root, null); }
    root.querySelectorAll(sel).forEach(el => { _nodeCenters.set(el, null); _nodeDims.set(el, null); });
    forEachShadow(root, walk);
  };
  walk(wrp);
}

function ownerWrapper(el) { // the .comp-wrapper owning el, hopping root>host out of shadow roots (closest can't cross them)
  let n = el;
  while (n) {
    const w = n.closest ? n.closest('.comp-wrapper') : null;
    if (w) return w;
    const root = n.getRootNode ? n.getRootNode() : null;
    n = (root && root.host) ? root.host : null;
  }
  return null;
}

function getNodeRect(el) { // node's cached/measured center + full box (centre+dims measured together) - null while unlaid-out
  if (!el) return null;

  const rectOf = (c, d) => ({ x: c.x, y: c.y, w: d.w, h: d.h, fx: d.fx, fy: d.fy, fw: d.fw, fh: d.fh });
  let center = _nodeCenters.get(el), dims = _nodeDims.get(el);
  if (center && dims) return rectOf(center, dims);
  // aim scv-logic cables at icon and capture full box so cable clips against input body
  const isLogic = el.tagName === 'SCV-LOGIC';
  // opt-in precise jack: an authored port can mark its exact visual anchor, checked in light dom and shadow dom
  const measured = isLogic ? (el.querySelector('.scv-logic-icon') || el)
                            : ((el.shadowRoot || el).querySelector('[data-scv-port]') || el);
  const r = measured.getBoundingClientRect();
  if (r.width === 0 && r.height === 0) { // zero box means hidden (anchor from stashed centre) or unlaid-out (retry waits)
    if (getComputedStyle(el).display === 'none') {
      const posEl = isLogic ? el : ownerWrapper(el); // cross shadow to wrapper
      if (posEl && (posEl.style.left || posEl.style.top)) { // anchor at stashed centre offset so it follows drags, else top left
        const ox = parseFloat(posEl.dataset.scvCx) || 0, oy = parseFloat(posEl.dataset.scvCy) || 0;
        const cx = px(posEl, 'left') + ox;
        const cy = px(posEl, 'top') + oy;
        return { x: cx, y: cy, w: 0, h: 0, fx: cx, fy: cy, fw: 0, fh: 0 };
      }
    }
    return null; // settling (> retry) or hidden without a position > can't place it
  }
  const z = session.zoom, sl = canvasContainer.scrollLeft, st = canvasContainer.scrollTop;
  center = { x: (r.left + r.width / 2 + sl) / z, y: (r.top + r.height / 2 + st) / z };
  const fr = isLogic ? el.getBoundingClientRect() : r;
  dims = { w: r.width / z, h: r.height / z,
           fx: (fr.left + fr.width / 2 + sl) / z, fy: (fr.top + fr.height / 2 + st) / z, fw: fr.width / z, fh: fr.height / z };
  _nodeCenters.set(el, center);
  _nodeDims.set(el, dims);
  // stash centre as an offset from box top-left so toggled-off node still anchors + follows drags
  const stashEl = isLogic ? el : ownerWrapper(el);
  if (stashEl) {
    const ox = Math.round(center.x - px(stashEl, 'left'));
    const oy = Math.round(center.y - px(stashEl, 'top'));
    if (+stashEl.dataset.scvCx !== ox) stashEl.dataset.scvCx = ox;
    if (+stashEl.dataset.scvCy !== oy) stashEl.dataset.scvCy = oy;
  }
  return rectOf(center, dims);
}

function edgePt(x, y, w, h, dx, dy) { // where cable meets rounded-rect node border (continuous) + outward normal
  const hw = w / 2, hh = h / 2, r = Math.min(hw, hh), len = Math.hypot(dx, dy) || 1;
  if (hw === 0 && hh === 0) return { x, y, nx: dx / len, ny: dy / len };
  const adx = Math.abs(dx) || 1e-9, ady = Math.abs(dy) || 1e-9;
  const t = Math.min(hw / adx, hh / ady); // ray ∩ the (square-cornered) box
  let ptX = dx * t, ptY = dy * t, nx, ny;
  const cx = hw - r, cy = hh - r; // start of corner arcs
  if (Math.abs(ptX) > cx && Math.abs(ptY) > cy) {
    const kx = Math.sign(ptX) * cx, ky = Math.sign(ptY) * cy; // nearest arc centre
    const ox = ptX - kx, oy = ptY - ky, ol = Math.hypot(ox, oy) || 1;
    nx = ox / ol; ny = oy / ol; ptX = kx + nx * r; ptY = ky + ny * r;
  } else if (hw / adx < hh / ady) { nx = Math.sign(ptX) || 1; ny = 0; } // left/right edge
  else { nx = 0; ny = Math.sign(ptY) || 1; } // top/bottom edge
  return { x: x + ptX, y: y + ptY, nx, ny };
}

function edgePtBox(cx, cy, bx, by, bw, bh, dx, dy) { // edgePt for open node: aim at icon but exit at full-body edge
  const hw = bw / 2, hh = bh / 2;
  const ox = cx - bx, oy = cy - by; // aim point relative to box centre
  // t to exit each axis; inf when ray doesn't move along that axis
  const tx = dx > 0 ? (hw - ox) / dx : dx < 0 ? (-hw - ox) / dx : Infinity;
  const ty = dy > 0 ? (hh - oy) / dy : dy < 0 ? (-hh - oy) / dy : Infinity;
  let t, nx = 0, ny = 0;
  if (tx < ty) { t = tx; nx = Math.sign(dx); } else { t = ty; ny = Math.sign(dy); }
  if (!isFinite(t)) return { x: cx, y: cy, nx: 0, ny: 0 }; // degenerate (coincident)
  return { x: cx + dx * t, y: cy + dy * t, nx, ny };
}

function axisDir(nx, ny) { // node's dominant-axis unit vector (sign-preserving square) so bezier bows, not dead-centre
  const bx = nx * Math.abs(nx), by = ny * Math.abs(ny), l = Math.hypot(bx, by) || 1;
  return { x: bx / l, y: by / l };
}

function bezierCurve(x1, y1, w1, h1, x2, y2, w2, h2) { // svg path for bezier cable (radial source, axis steered) - temp wire
  const dx = x2 - x1, dy = y2 - y1, dl = Math.hypot(dx, dy) || 1;
  const p0 = edgePt(x1, y1, w1, h1, dx, dy);
  const p3 = edgePt(x2, y2, w2, h2, -dx, -dy);
  const v1 = { x: dx / dl, y: dy / dl };
  const v2 = axisDir(p3.nx, p3.ny);
  const dist = Math.hypot(p3.x - p0.x, p3.y - p0.y) || 1;
  const off = Math.max(dist * BEZIER_OFFSET_FACTOR, BEZIER_MIN_OFFSET);
  const offS = off * BEZIER_SOURCE_RATIO;
  return 'M ' + p0.x + ' ' + p0.y + ' C '
    + (p0.x + v1.x * offS) + ' ' + (p0.y + v1.y * offS) + ', '
    + (p3.x + v2.x * off) + ' ' + (p3.y + v2.y * off) + ', '
    + p3.x + ' ' + p3.y;
}

function cableArrow(x1, y1, w1, h1, x2, y2, w2, h2, fb1, fb2) { // bezier cable truncated before target + arrow; null if too close
  const dx = x2 - x1, dy = y2 - y1, dl = Math.hypot(dx, dy) || 1;
  // fb1/fb2 (full node box, only when open): clip icon-aimed ray against body so wire stops at its edge, not input
  const p0 = fb1 ? edgePtBox(x1, y1, fb1.x, fb1.y, fb1.w, fb1.h, dx, dy) : edgePt(x1, y1, w1, h1, dx, dy);
  const p3 = fb2 ? edgePtBox(x2, y2, fb2.x, fb2.y, fb2.w, fb2.h, -dx, -dy) : edgePt(x2, y2, w2, h2, -dx, -dy);
  const v1 = { x: dx / dl, y: dy / dl };

  stop(e);
