  if (!isSelected(logicNode)) { // moving an unselected handle selects it first, matching component moves
    clearSelection();
    selectEl(logicNode);
    updateSelectionDim();
  }
  let targets;
  if (isSelected(logicNode) && selectedCount() > 1) { targets = buildMultiDragTargets(selectedEls()); }
  session.activeDrag = {
    type: 'logic-move', wrapper: logicNode, el: logicNode,
    beforeX: px(logicNode, 'left'), beforeY: px(logicNode, 'top'),
    startX: e.clientX, startY: e.clientY, startScrollTop: canvasContainer.scrollTop,
    scale: 1, translateX: 0, translateY: 0, scrollDelta: 0,
    oldZIndex: logicNode.style.zIndex, // dragged set by move threshold - a bare handle click stays a selection
    pointerId: e.pointerId, captureTarget: e.target,
    targets
  };
  if (!targets) {
    logicNode.style.zIndex = (parseInt(window.getComputedStyle(logicNode).zIndex) || 1) + 10;
  }
  dragOverlay.style.display = 'block';
  dragOverlay.style.cursor = 'grabbing';
  try { e.target.setPointerCapture(e.pointerId); } catch { console.warn('setPointerCapture failed'); }
}

document.addEventListener('pointerdown', e => {
  if (e.button > 1) return; // right-click opens context menu only - never deletes, reorders or wires
  if (e.ctrlKey && navigator.platform?.toLowerCase().includes('mac')) return; // mac ctrl + click is right-click - let contextmenu handle it, no move/wire arm
  if (e.target.closest('.scv-logic-del')) {
    const logic = e.target.closest('scv-logic');
    if (isSelected(logic) && selectedCount() > 1) { deleteSelected(); } else { deleteElementWithUndo(logic); }
    return;
  }
  if (e.target.closest('.comp-del')) {
    const wrapper = e.target.closest('.comp-wrapper');
    if (isSelected(wrapper) && selectedCount() > 1) { deleteSelected(); }
    else { deleteElementWithUndo(wrapper, wrapper.querySelector('[data-scv-id]')); }
    renderCables();
    return;
  }
  if (e.target.closest('.comp-z-up, .comp-z-down')) {
    const wrapper = e.target.closest('.comp-wrapper');
    const dir = e.target.closest('.comp-z-up') ? 1 : -1;
    const zTargets = (isSelected(wrapper) && selectedCount() > 1 ? selectedEls() : [wrapper]).filter(Boolean);
    const zBefore = zTargets.map(w => w.style.zIndex);
    zTargets.forEach(w => { w.style.zIndex = Math.max(0, (parseInt(window.getComputedStyle(w).zIndex) || 1) + dir); });
    const zAfter = zTargets.map(w => w.style.zIndex);
    pushUndo(
      () => { zTargets.forEach((w, i) => w.style.zIndex = zAfter[i]); },
      () => { zTargets.forEach((w, i) => w.style.zIndex = zBefore[i]); },
      'z-order ' + zTargets.length
    );
    return;
  }
  if (e.target.closest('.comp-drag-handle')) { onPointerDownComponent(e); return; }
  if (e.button === 1) {
    stop(e);
    expandCanvasWidth(canvasContainer.scrollLeft);
    expandCanvasHeight(canvasContainer.scrollTop);
    session.panState = { startX: e.clientX, startY: e.clientY,
      scrollLeft: canvasContainer.scrollLeft, scrollTop: canvasContainer.scrollTop };
    dragOverlay.style.cursor = 'grabbing';
    return;
  }
  if (session.mode === 'use') return;
  if (e.target.classList.contains('scv-logic-drag')) { onScvLogicDrag(e); return; }
  if (e.target.classList.contains('cable-path') && !e.target.classList.contains('cable-temp')) {
    const key = e.target._cableKey;
    const tgtEl = e.target._cableTarget;
    if (key && tgtEl) {
      const parts = key.split('::');
      const channelName = parts[0];
      const prevRecv = tgtEl.getAttribute(ATTR_RECEIVES); // capture for undo
      const prevAct = tgtEl.getAttribute(ATTR_ACTION);
      const applyDelete = () => { // one click peels one layer - a receives+action pair on same channel is two distinct wirings sharing one rendered cable (eachWire dedups by channel), so stripping both at once would silently drop whichever the click didn't mean to touch. Receives goes first (the common case); a second click on the now action-only cable takes that too.
        const hasRecv = splitWords(tgtEl.getAttribute(ATTR_RECEIVES)).includes(channelName);
        if (hasRecv) {
          const r = splitWords(tgtEl.getAttribute(ATTR_RECEIVES)).filter(ch => ch !== channelName);
          if (r.length) tgtEl.setAttribute(ATTR_RECEIVES, r.join(' ')); else tgtEl.removeAttribute(ATTR_RECEIVES);
        } else { // action tokens are verb:channel or verb:arg:channel (compound), not bare channel names - channel is embedded, so a whole-token compare never matches (mirrors _remapWire's own parsing)
          const a = splitWords(tgtEl.getAttribute(ATTR_ACTION)).filter(t => {
            const parts = t.split(':');
            if (parts.length < 2) return true; // bare macro verb, no channel - unrelated to this delete, keep
            const chIdx = COMPOUND_VERBS.includes(parts[0]) ? 2 : 1;
            return parts.length <= chIdx || parts[chIdx] !== channelName;
          });
          if (a.length) tgtEl.setAttribute(ATTR_ACTION, a.join(' ')); else tgtEl.removeAttribute(ATTR_ACTION);
        }
        invalidateCache();
        renderCables();
      };
      applyDelete();
      pushUndo(
        applyDelete, // redo: strip again
        () => { // undo: restore target's wiring
          if (prevRecv != null) tgtEl.setAttribute(ATTR_RECEIVES, prevRecv); else tgtEl.removeAttribute(ATTR_RECEIVES);
          if (prevAct != null) tgtEl.setAttribute(ATTR_ACTION, prevAct); else tgtEl.removeAttribute(ATTR_ACTION);
          invalidateCache();
          renderCables();
        },
        'delete-wire'
      );
    }
    return;
  }
  if (session.isChainPending && session.lastSpawned) { // resolve same precise target drag-wire does, piercing shadow to sub-el
    const target = getValidWiringTarget(e);
    const inCanvas = e.composedPath().some(n => n.id === 'zoom-layer' || n.id === 'canvas-container'); // context-menu/toolbar buttons must not become wiring targets
    if (target && target !== session.lastSpawned && inCanvas) {
      stop(e);
      if (e.ctrlKey || e.metaKey) { autoWire(target, session.lastSpawned); } else { autoWire(session.lastSpawned, target); }
      tempWire.classList.add('hidden');
      session.isChainPending = false;
      // pointerdown still fires click; swallow it so space-chain wiring to node doesn't toggle its mode
      let swallowT;
      const swallow = ev => {
        ev.stopPropagation(); ev.preventDefault();
        clearTimeout(swallowT); document.removeEventListener('click', swallow, true);
      };
      document.addEventListener('click', swallow, true);
      swallowT = setTimeout(() => document.removeEventListener('click', swallow, true), 500);
      return;
    }
    // no valid target while armed: cancel chain + hide dangling temp-wire before falling through, else cable lingers
    session.isChainPending = false;
    session.lastSpawned = null;
    tempWire.classList.add('hidden');
  }
  if (e.shiftKey && e.target.closest('scv-logic')) { onPointerDownComponent(e); return; }
  if ((e.ctrlKey || e.metaKey) && !e.target.closest('input,textarea,select')) {
    if (e.target.closest('scv-logic')) { onScvLogicDrag(e); return; }
    onPointerDownComponent(e);
    return;
  }
  if (getValidWiringTarget(e)) { onPointerDownWiring(e); return; }
  onPointerDownComponent(e);
  return;
});

const TOGGLE_TYPES = new Set(['gate', 'comparator', 'action']);
function isUndoableToggle(node) { // report whether node has toggle to record
  return TOGGLE_TYPES.has(node.dataset.type) || node._modeIdx !== undefined; // custom node w/ modes
}

function toggleSnapshot(node) { // capture node's toggle state (class/icon/value/mode) for undo
  const icon = node.querySelector('.scv-logic-icon'), input = node.querySelector('.scv-logic-input');
  return {
    active: node.classList.contains('active'),
    icon: icon ? icon.textContent : '', iconBg: icon ? icon.style.background : '',
    value: input ? input.value : '', color: input ? input.style.color : '',
    scvMode: node.dataset.scvMode, _invert: node._invert, _modeIdx: node._modeIdx, _label: node._label,
  };
}

function toggleRestore(node, s) { // restore node's toggle state from snapshot (and re-fire onMode)
  const icon = node.querySelector('.scv-logic-icon'), input = node.querySelector('.scv-logic-input');
  node.classList.toggle('active', s.active);
  if (icon) { icon.textContent = s.icon; icon.style.background = s.iconBg; }
  if (input) { input.value = s.value; input.style.color = s.color; }
  if (s.scvMode != null) node.dataset.scvMode = s.scvMode; else delete node.dataset.scvMode;
  node._invert = s._invert; node._modeIdx = s._modeIdx; node._label = s._label;
  // keep comparator's persisted attr in step with restored prop, so undo then quine save doesn't serialize a stale inversion
  if (typeof s._invert === 'boolean') { if (s._invert) node.dataset.cmpInvert = '1'; else delete node.dataset.cmpInvert; }
  if (node._applyMode) node._applyMode(true); // custom node: re-run applyMode so def.onMode re-fires and side effects re-sync
}

function toggleChanged(a, b) { // report whether any recorded toggle field differs between two snapshots
  return a.active !== b.active || a.icon !== b.icon || a.iconBg !== b.iconBg || a.value !== b.value || a.color !== b.color
      || a._invert !== b._invert || a._modeIdx !== b._modeIdx || a.scvMode !== b.scvMode || a._label !== b._label;
}

canvasContainer.addEventListener('click', e => {
  const iconEl = e.target.closest('.scv-logic-icon');
  if (!iconEl) return;
  const node = iconEl.closest('scv-logic');
  if (!node || !isUndoableToggle(node)) return;
  const before = toggleSnapshot(node);
  setTimeout(() => { // node's own click handler runs during same dispatch (bubble) - read result next task then record
    const after = toggleSnapshot(node);
    if (!toggleChanged(before, after)) return;
    pushUndo(
      () => toggleRestore(node, after),
      () => toggleRestore(node, before),
      'toggle ' + (node.dataset.type || 'node')
    );
  }, 0);
}, true);

canvasContainer.addEventListener('dblclick', e => { // lasso group open/close: dbl-click one inverts every node's open state
  const clicked = e.target.closest('scv-logic');
  if (!clicked || selectedCount() < 2 || !isSelected(clicked)) return;
  if (e.target.closest('.scv-logic-input')) return;
  const affected = selectedEls().filter(el => el !== clicked && el.tagName === 'SCV-LOGIC');
  const applyToggle = () => { affected.forEach(el => { el.classList.toggle('open'); clearCachesIn(el); }); renderCables(); };
  applyToggle();
  if (affected.length) pushUndo(applyToggle, applyToggle, 'group open/close'); // a pure toggle - re-running it is its own inverse
});

// drag lifecycle

function applyCrop(wrapper, el, crop) { // write crop {top, right, bottom, left} to wrapper's --c-* vars + clip component host inset
  wrapper.style.setProperty('--c-t', crop.top + 'px');
  wrapper.style.setProperty('--c-r', crop.right + 'px');
  wrapper.style.setProperty('--c-b', crop.bottom + 'px');
  wrapper.style.setProperty('--c-l', crop.left + 'px');
  const clip = el?.closest?.('.scv-link-card') || el; // link cards crop whole card, not just thumbnail
  if (clip) clip.style.clipPath = `inset(${crop.top}px ${crop.right}px ${crop.bottom}px ${crop.left}px)`;
}

const _lastPointer = { x: 0, y: 0 };
document.addEventListener('pointermove', e => {
  _lastPointer.x = e.clientX; _lastPointer.y = e.clientY; session.ctrlHeld = !!(e.ctrlKey || e.metaKey);
  if (session.panState) {
    const newSL = session.panState.scrollLeft + (session.panState.startX - e.clientX);
    const newST = session.panState.scrollTop + (session.panState.startY - e.clientY);
    if (newSL > canvasContainer.scrollWidth - canvasContainer.clientWidth) { expandCanvasWidth(newSL); }
    if (newST > canvasContainer.scrollHeight - canvasContainer.clientHeight) { expandCanvasHeight(newST); }
    canvasContainer.scrollLeft = newSL;
    canvasContainer.scrollTop = newST;
    return;
  }
  if (session.lassoStart && session.mode === 'edit') {
    const dx = e.clientX - session.lassoStart.clientX;
    const dy = e.clientY - session.lassoStart.clientY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
      const box = document.getElementById('lasso-box');
      box.style.display = 'block';
      box.style.left = Math.min(session.lassoStart.clientX, e.clientX) + 'px';
      box.style.top = Math.min(session.lassoStart.clientY, e.clientY) + 'px';
      box.style.width = Math.abs(dx) + 'px';
      box.style.height = Math.abs(dy) + 'px';
    }
    return;
  }

  if (session.isChainPending && session.lastSpawned) {
    tempWire.classList.remove('hidden');
    tempWire.classList.toggle('cable-temp-reverse', session.ctxLockDir !== null ? session.ctxLockDir : !!(e.ctrlKey || e.metaKey));
    const src = getNodeRect(session.lastSpawned);
    const z = session.zoom;
    if (src) tempWire.setAttribute('d', bezierCurve(src.x, src.y, src.w, src.h,
      (e.clientX + canvasContainer.scrollLeft) / z, (e.clientY + canvasContainer.scrollTop) / z, 0, 0));
  }
  session.moveEv = e;
  if (!session.activeDrag) {
    if (session.mode === 'edit') {
      if (e.target?.closest?.('[id*="scv-"]') || selectedCount() > 0) { tooltip.style.display = 'none'; return; } // e.target is occasionally not an Element (e.g. document itself) - no .closest then
      const target = getValidWiringTarget(e);
      if (target && !e.target?.closest?.('#bg-dot, #intro-backdrop, #intro-menu')) { // never label workshop chrome
        // freshly-spawned node under cursor mutes first hover (no tooltip on appear); un-mutes once cursor leaves
        if (target === session.tipMuted) { tooltip.style.display = 'none'; return; }
        session.tipMuted = null;
        tooltip.textContent = target.id ? `#${target.id}` : nodeLabel(target);
        tooltip.style.display = 'block';
        placeTooltip(tooltip, e.clientX, e.clientY);
      }
      else { session.tipMuted = null; tooltip.style.display = 'none'; }
    }
    return;
  }

  if (session.activeDrag.type === 'move' || session.activeDrag.type === 'logic-move') { // record move - raf applies it as left/top
    tooltip.style.display = 'none';
    session.activeDrag.scrollDelta = canvasContainer.scrollTop - session.activeDrag.startScrollTop;
    if (Math.abs(e.clientX - session.activeDrag.startX) > DRAG_THRESHOLD
        || Math.abs(e.clientY - session.activeDrag.startY) > DRAG_THRESHOLD) { // lift + commit only after real movement
      session.activeDrag.dragged = true;
      session.activeDrag.translateX = (e.clientX - session.activeDrag.startX) / session.zoom;
      session.activeDrag.translateY = (e.clientY - session.activeDrag.startY + session.activeDrag.scrollDelta) / session.zoom;
      if (session.activeDrag.wrapper) session.activeDrag.wrapper.classList.add('dragging');
    }
  }

  if (!session.ticking) {
    window.requestAnimationFrame(() => {
      if (!session.activeDrag) { session.ticking = false; return; }

      const ev = session.moveEv;
      if (session.activeDrag.type === 'wire') {
        if (!session.activeDrag.isDrag) {
          const dx = ev.clientX - session.activeDrag.startX;
          const dy = ev.clientY - session.activeDrag.startY;
          if (Math.abs(dx) <= DRAG_THRESHOLD && Math.abs(dy) <= DRAG_THRESHOLD) {
            session.ticking = false; return;
          }
        }
        session.activeDrag.isDrag = true;
        tempWire.classList.remove('hidden');
        tempWire.classList.toggle('cable-temp-reverse', session.ctrlHeld);
        const src = getNodeRect(session.activeDrag.el);
        const isLogic = session.activeDrag.el.tagName === 'SCV-LOGIC';
        const z = session.zoom;
        if (src) tempWire.setAttribute('d', bezierCurve(src.x, src.y, isLogic ? src.w : 0, isLogic ? src.h : 0,
          (ev.clientX + canvasContainer.scrollLeft) / z, (ev.clientY + canvasContainer.scrollTop) / z, 0, 0));
        tooltip.style.display = 'none';
      }
      else if (session.activeDrag.type === 'scale') {
        session.activeDrag.dragged = true;
        let newScale = Math.max(0.1, session.activeDrag.scale
          * (Math.hypot(ev.clientX - session.activeDrag.originX, ev.clientY - session.activeDrag.originY) / session.activeDrag.dist));
        if (ev.altKey) { // whole cells while alt is held - origin is top left, far edge lands on lattice too
          const w = session.activeDrag.wrapper.offsetWidth || 1;
          newScale = Math.max(GRID_STEP, Math.round(w * newScale / GRID_STEP) * GRID_STEP) / w;
        }
        session.activeDrag.wrapper.style.scale = newScale;
        clearCachesIn(session.activeDrag.wrapper);
        if (session.activeDrag.scaleTargets) {
          const ratio = newScale / session.activeDrag.scale;
          session.activeDrag.scaleTargets.forEach(t => { t.wrapper.style.scale = t.oldScale * ratio; clearCachesIn(t.wrapper); });
        }
        renderCables();
      }
      else if (session.activeDrag.type === 'move' || session.activeDrag.type === 'logic-move') {
        // drag via transform so node moves as one layer (per-frame left/top would wobble children) - drop bakes left/top
        const d = session.activeDrag;
        let tx = Math.round(d.translateX);
        let ty = Math.round(d.translateY);
        if (ev.altKey) { // magnetise while alt is held - jumps to dot so preview is the landing
          const [ax, ay] = snapAnchor(d);
          tx += snapAxis(d.beforeX + ax + tx) - (d.beforeX + ax + tx);
          ty += snapAxis(d.beforeY + ay + ty) - (d.beforeY + ay + ty);
        }
        d.snapX = tx; d.snapY = ty; // commit lands on previewed delta rather than recomputing
        const place = (w, scale) => { w.style.transform = `translate3d(${tx / scale}px, ${ty / scale}px, 0)`; };
        if (session.activeDrag.targets) {
          session.activeDrag.targets.forEach(t => { place(t.wrapper, t.scale || 1); clearCachesIn(t.wrapper); });
        } else if (session.activeDrag.wrapper) {
          place(session.activeDrag.wrapper, session.activeDrag.scale || 1);
          clearCachesIn(session.activeDrag.wrapper);
        }
        renderCables();
      }
      else if (session.activeDrag.type === 'crop') {
        session.activeDrag.dragged = true;
        const dx = (ev.clientX - session.activeDrag.startX) / session.zoom / session.activeDrag.scale;
        const dy = (ev.clientY - session.activeDrag.startY) / session.zoom / session.activeDrag.scale;
        let { top, right, bottom, left } = session.activeDrag.crop;
        if (session.activeDrag.edge === 't') top = Math.max(0, top + dy);
        if (session.activeDrag.edge === 'b') bottom = Math.max(0, bottom - dy);
        if (session.activeDrag.edge === 'l') left = Math.max(0, left + dx);
        if (session.activeDrag.edge === 'r') right = Math.max(0, right - dx);
        if (ev.altKey) { // snap cut edge - trimmed border lines up with dot grid
          const d = session.activeDrag, sc = d.scale || 1;
          const wx = px(d.wrapper, 'left'), wy = px(d.wrapper, 'top');
          const box = d.el?.closest?.('.scv-link-card') || d.el; // the box applyCrop clips - link card crops whole, not by thumb
          const ew = box?.offsetWidth || 0, eh = box?.offsetHeight || 0;
          if (d.edge === 't') top = Math.max(0, (snapAxis(wy + top * sc) - wy) / sc);
          if (d.edge === 'b') bottom = Math.max(0, eh - (snapAxis(wy + (eh - bottom) * sc) - wy) / sc);
          if (d.edge === 'l') left = Math.max(0, (snapAxis(wx + left * sc) - wx) / sc);
          if (d.edge === 'r') right = Math.max(0, ew - (snapAxis(wx + (ew - right) * sc) - wx) / sc);
        }
        applyCrop(session.activeDrag.wrapper, session.activeDrag.el, { top, right, bottom, left });
        // crop changes geometry - invalidate node's cached center/dims so cables redraw to new edges
        if (session.activeDrag.el) { _nodeCenters.set(session.activeDrag.el, null); _nodeDims.set(session.activeDrag.el, null); }
        renderCables();
      }
      session.ticking = false;
    });
    session.ticking = true;
  }
});

function finishLasso(e) { // select every node/wrapper inside lasso box, then clear it
  const box = document.getElementById('lasso-box');
  if (box.style.display !== 'none') {
    const lr = {
      left: Math.min(session.lassoStart.clientX, e.clientX),
      top: Math.min(session.lassoStart.clientY, e.clientY),
      right: Math.max(session.lassoStart.clientX, e.clientX),
      bottom: Math.max(session.lassoStart.clientY, e.clientY),
    };
    getSelectableChildren().forEach(el => {
      const r = el.getBoundingClientRect();
      if (!(r.right < lr.left || r.left > lr.right || r.bottom < lr.top || r.top > lr.bottom)) {
        selectEl(el);
      }
    });
    updateSelectionDim();
  }
  box.style.display = 'none';
  session.lassoStart = null;
}

function commitWireDrop(e, drag) { // drop wire drag: onto a node > wire it; onto empty canvas > spawn-menu
  session.isChainPending = false;
  const src = drag.el;
  const target = getValidWiringTarget(e);
  const wiringDir = session.ctrlHeld;
  if (target) {
    tempWire.classList.add('hidden'); // resolved target clears preview; a different node wires, same is a no-op
    tooltip.style.display = 'none';
    if (target !== src) { if (wiringDir) autoWire(target, src); else autoWire(src, target); }
  } else {
    tooltip.style.display = 'none';
    const z = session.zoom;
    const dropX = (e.clientX + canvasContainer.scrollLeft) / z, dropY = (e.clientY + canvasContainer.scrollTop) / z;
    const srcRect = getNodeRect(src);
    if (srcRect) {
      tempWire.classList.remove('hidden');
      tempWire.classList.toggle('cable-temp-reverse', wiringDir);
      tempWire.setAttribute('d', bezierCurve(srcRect.x, srcRect.y, 0, 0, dropX, dropY, 0, 0));
    }
    session.activeDrag = null;
    showMenu(
      nodeTypeList().map(type => ({
        label: '[node] - ' + type,
        fn: () => {
          const node = spawnLogicNode(type, dropX, dropY);
          session.tipMuted = node; // spawns under cursor - mute first hover-tooltip
          pushSpawnUndo(node, type);
          if (wiringDir) autoWire(node, src); else autoWire(src, node);
          tempWire.classList.add('hidden');
          session.lastSpawned = node;
        },
      })),
      e.clientX, e.clientY,
      () => { tempWire.classList.add('hidden'); }
    );
  }
}

function commitWrapperDrop(e, drag) { // land move/scale/crop drag on wrapper(s) and record undo
  const { wrapper, beforeX, beforeY, oldZIndex, el, targets } = drag;
  if (drag.type === 'move' || drag.type === 'logic-move') { // land on last rendered translate from drag, not fresh read
    const tx = drag.snapX ?? drag.translateX, ty = drag.snapY ?? drag.translateY; // whatever last frame drew, magnetised or not
    if (targets) {
      targets.forEach(t => {
        t.wrapper.style.transform = '';
        t.wrapper.style.left = Math.round(t.beforeX + tx) + 'px';
        t.wrapper.style.top = Math.round(t.beforeY + ty) + 'px';
      });
    } else {
      wrapper.style.transform = '';
      wrapper.style.left = Math.round(beforeX + tx) + 'px';
      wrapper.style.top = Math.round(beforeY + ty) + 'px';
    }
    if (targets) targets.forEach(t => clearCachesIn(t.wrapper));
    else clearCachesIn(wrapper);
    renderCables();
  }
  if ((drag.type !== 'move' && drag.type !== 'logic-move') || drag.dragged) { // scale/crop settle always; move/logic only after real movement
    if (targets) targets.forEach(t => t.wrapper.style.zIndex = t.oldZIndex);
    else wrapper.style.zIndex = oldZIndex;
    if (drag.type === 'move' || drag.type === 'logic-move') {
      if (targets) {
        targets.forEach(t => { t.wrapper.style.zIndex = Math.max(1, (parseInt(t.oldZIndex) || 1) + 1); });
        const afterStates = targets.map(t => ({
          wrapper: t.wrapper, el: t.el,
          left: t.wrapper.style.left,
          top: t.wrapper.style.top,
          zIndex: t.wrapper.style.zIndex,
          beforeX: t.beforeX, beforeY: t.beforeY, oldZIndex: t.oldZIndex,
        }));
        pushUndo(
          () => {
            afterStates.forEach(s => {
              s.wrapper.style.left = s.left;
              s.wrapper.style.top = s.top;
              s.wrapper.style.zIndex = s.zIndex;
              clearCachesIn(s.wrapper);
            });
            renderCables();
          },
          () => {
            afterStates.forEach(s => {
              s.wrapper.style.left = s.beforeX + 'px';
              s.wrapper.style.top = s.beforeY + 'px';
              s.wrapper.style.zIndex = s.oldZIndex;
              clearCachesIn(s.wrapper);
            });
            renderCables();
          },
          'drag'
        );
        if (parseInt(afterStates[0].zIndex) > 1000) normalizeZIndex();
      } else {
        const newZ = Math.max(1, (parseInt(oldZIndex) || 1) + 1);
        wrapper.style.zIndex = newZ;
        const newLeft = wrapper.style.left, newTop = wrapper.style.top, newZIndex = wrapper.style.zIndex;
        pushUndo(
          () => {
            wrapper.style.left = newLeft;
            wrapper.style.top = newTop;
            wrapper.style.zIndex = newZIndex;
            clearCachesIn(wrapper); renderCables();
          },
          () => {
            wrapper.style.left = beforeX + 'px';
            wrapper.style.top = beforeY + 'px';
            wrapper.style.zIndex = oldZIndex;
            clearCachesIn(wrapper); renderCables();
          },
          'drag'
        );
        if (newZ > 1000) normalizeZIndex();
      }
    }
    dragOverlay.style.display = 'none';
  } else if (drag.type === 'move' || drag.type === 'logic-move') { // bare click with no real movement: drop lift, record nothing
    if (targets) targets.forEach(t => t.wrapper.style.zIndex = t.oldZIndex);
    else wrapper.style.zIndex = oldZIndex;
    dragOverlay.style.display = 'none';
  }
  if (drag.type === 'scale' && drag.dragged) {
    const prevScale = drag.scale;
    const nextScale = parseFloat(wrapper.style.scale) || 1;
    if (drag.scaleTargets) {
      const scaleStates = [{ wrapper: wrapper, oldScale: prevScale, newScale: nextScale }];
      drag.scaleTargets.forEach(t => {
        scaleStates.push({ wrapper: t.wrapper, oldScale: t.oldScale, newScale: parseFloat(t.wrapper.style.scale) || 1 });
      });
      pushUndo(
        () => { scaleStates.forEach(s => { s.wrapper.style.scale = s.newScale; clearCachesIn(s.wrapper); }); renderCables(); },
        () => { scaleStates.forEach(s => { s.wrapper.style.scale = s.oldScale; clearCachesIn(s.wrapper); }); renderCables(); },
        'scale ' + scaleStates.length
      );
    } else {
      pushUndo(
        () => { wrapper.style.scale = nextScale; clearCachesIn(wrapper); renderCables(); },
        () => { wrapper.style.scale = prevScale; clearCachesIn(wrapper); renderCables(); },
        'scale'
      );
    }
  } else if (drag.type === 'crop' && drag.dragged) {
    const prevCrop = drag.crop;
    const nextCrop = {
      top: parseFloat(wrapper.style.getPropertyValue('--c-t')) || 0,
      right: parseFloat(wrapper.style.getPropertyValue('--c-r')) || 0,
      bottom: parseFloat(wrapper.style.getPropertyValue('--c-b')) || 0,
      left: parseFloat(wrapper.style.getPropertyValue('--c-l')) || 0
    };
    pushUndo(
      () => { applyCrop(wrapper, el, nextCrop); clearCachesIn(wrapper); renderCables(); },
      () => { applyCrop(wrapper, el, prevCrop); clearCachesIn(wrapper); renderCables(); },
      'crop'
    );
  }
}

document.addEventListener('pointerup', e => { // route drop to right commit path, then clear drag
  if (session.activeDrag && session.activeDrag.wrapper) session.activeDrag.wrapper.classList.remove('dragging'); // drop: ease lift back
  if (session.panState) { stop(e); session.panState = null; dragOverlay.style.cursor = ''; return; }
  if (session.lassoStart) { finishLasso(e); return; }
  if (!session.activeDrag) { dragOverlay.style.display = 'none'; return; }
  const drag = session.activeDrag;
  if (drag.captureTarget) { try { drag.captureTarget.releasePointerCapture(drag.pointerId); } catch { console.warn('ptrRelease'); } }
  if (drag.type === 'wire') commitWireDrop(e, drag);
  else if (drag.wrapper) commitWrapperDrop(e, drag);
  session.activeDrag = null;
});

function revertActiveDrag() { // revert any active drag to its pre-drag state - escape and pointercancel share this
  const drag = session.activeDrag;
  if (!drag) return;
  if (drag.captureTarget) { try { drag.captureTarget.releasePointerCapture(drag.pointerId); } catch { console.warn('ptrRelease'); } }
  if (drag.type === 'move' || drag.type === 'logic-move') {
    const revert = t => {
      t.wrapper.classList.remove('dragging'); t.wrapper.style.transform = '';
      t.wrapper.style.zIndex = t.oldZIndex; clearCachesIn(t.wrapper);
    };
    if (drag.targets) drag.targets.forEach(revert); else revert(drag);
  } else if (drag.type === 'scale') {
    drag.wrapper.style.scale = drag.scale;
    clearCachesIn(drag.wrapper);
    (drag.scaleTargets || []).forEach(t => { t.wrapper.style.scale = t.oldScale; clearCachesIn(t.wrapper); });
  } else if (drag.type === 'crop') {
    applyCrop(drag.wrapper, drag.el, drag.crop);
    clearCachesIn(drag.wrapper);
  } else if (drag.type === 'wire') {
    session.isChainPending = false;
    tempWire.classList.add('hidden');
    tooltip.style.display = 'none';
  }
  renderCables();
  dragOverlay.style.display = 'none';
  session.activeDrag = null;
}

document.addEventListener('pointercancel', e => { // hijacked gesture fires pointercancel - revert drag type to pre drag state
  if (session.panState) { session.panState = null; dragOverlay.style.cursor = ''; return; }
  if (session.lassoStart) { document.getElementById('lasso-box').style.display = 'none'; session.lassoStart = null; return; }
  revertActiveDrag();
});

// clipboard

const NODES_CLIP_PREFIX = 'scavenger:nodes:';
document.addEventListener('copy', e => { // one clipboard - last write wins - copy tags selection scavenger:nodes
  const t = e.composedPath()[0]; // e.target is retargeted to shadow host across a shadow boundary - real focused el is first in path
  if (t?.tagName === 'INPUT' || t?.tagName === 'TEXTAREA' || t?.isContentEditable) return;
  if (!selectedCount()) return; // nothing selected > browser copy normally
  copySelected();
  try { e.clipboardData.setData('text/plain', NODES_CLIP_PREFIX + JSON.stringify(_clipboardData)); } catch { console.warn('setData'); }
  e.preventDefault();
});

function looksLikeScvPayload(text) { // report whether text is an importable scavenger payload (harvest/.scv/dashboard)
  return /<scv-/i.test(text) || text.includes('data-scv-component') ||
         text.includes('data-scv-def') || text.includes('data-scv-node') ||
         text.includes('comp-wrapper');
}

const wrapperMarkup = (inner, px, py) => { // handled comp-wrapper around pasted payload (img component, link card)
  const z = session.zoom;
  return `<div class="comp-wrapper" style="left:${(px + canvasContainer.scrollLeft) / z}px;top:${(py + canvasContainer.scrollTop) / z}px">${COMP_CHROME}${inner}</div>`;
};

function imgWrapperMarkup(dataUrl, px, py) { // build handled comp-wrapper payload for pasted bitmap - handlePasteData imports like component
  // clamp to a sane on-canvas size (a native screenshot can be thousands of px) - aspect ratio preserved, scale handle sizes up/down from here
  return wrapperMarkup(`<img data-scv-id="img_${uid(9)}" src="${dataUrl}" style="max-width:400px;max-height:400px">`, px, py);
}

const _escHtml = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); // card markup escapes own text/urls

function linkCardMeta(url) { // pure path meta for pasted link - patchbay-alone base card
  let u; try { u = new URL(url); } catch { return { title: url, desc: '', image: '' }; }
  const host = u.hostname.replace(/^www\./, '');
  let path = u.pathname; try { path = decodeURIComponent(path); } catch {} // a malformed escape degrades to raw path, never throws
  path = path.replace(/^\/+|\/+$/g, '').split('/').filter(Boolean).join(' / ');
  return { title: host, desc: path || '(root)', image: u.origin + '/favicon.ico' };
}

function linkCardMarkup(url, meta, px, py) { // build handled comp-wrapper payload for pasted link - handlePasteData imports like component
  const href = _escHtml(url);
  return wrapperMarkup(`<div class="scv-link-card"><img class="scv-lc-thumb" data-scv-id="link_${uid(9)}" src="${_escHtml(meta.image)}" alt="" loading="lazy" referrerpolicy="no-referrer"><div class="scv-lc-body"><div class="scv-lc-title">${_escHtml(meta.title)}</div><div class="scv-lc-desc">${_escHtml(meta.desc)}</div><a class="scv-lc-open" href="${href}" target="_blank" rel="noopener">open ↗</a></div></div>`, px, py);
}

function linkCard(url, px, py) { // paste bare link as link card - imports instantly, quests enriches
  url = String(url).trim().replace(/[.,;:!?]+$/, '');
  const added = handlePasteData(linkCardMarkup(url, linkCardMeta(url), px, py));
  selectPasted(added);
  enrichCard(added?.[0], url);
}

async function enrichCard(w, url) { // quest server unfurl: fill real title/description/image - down server re-arms retry poll
  if (!w?.isConnected || !window.__QUEST_API__) return;
  const card = w.querySelector('.scv-link-card');
  if (!card || card.dataset.scvLc) return; // already answered (enriched, or nothing more to fetch)
  let cap;
  const meta = await Promise.race([
    fetch(window.__QUEST_API__ + '/unfurl?url=' + encodeURIComponent(url)).then(r => (r.ok ? r.json() : null)).catch(() => null),
    new Promise(res => { cap = setTimeout(() => res(null), 3000); }),
  ]).finally(() => clearTimeout(cap));
  if (meta == null) { if (w.isConnected) _armCardRetry(); return; } // quests down - silent-upgrade re-fetches card later
  if (!w.isConnected) return;
  const title = card.querySelector('.scv-lc-title'), desc = card.querySelector('.scv-lc-desc'), thumb = card.querySelector('.scv-lc-thumb');
  if (title && meta.title) title.textContent = meta.title;
  if (desc && meta.description) desc.textContent = meta.description;
  if (thumb && meta.image) { const b64 = await toBase64(meta.image); if (b64) thumb.setAttribute('src', b64); }
  card.dataset.scvLc = '1'; // server answered - card is done (serializes through quines, won't refetch on reopen)
}

let _lcRetry = null; // silent upgrade poll: re-fetch host cards every 5s while quests is down - self-stops when empty
function _stopCardRetry() { if (_lcRetry) { clearInterval(_lcRetry); _lcRetry = null; } }
function _armCardRetry() { if (_lcRetry) return; _lcRetry = setInterval(enrichCards, 5000); }
async function enrichCards() { // sweep every card not filled - boots on load and on retry poll
  if (!window.__QUEST_API__) return _stopCardRetry();
  const cards = [...document.querySelectorAll('.comp-wrapper .scv-link-card:not([data-scv-lc])')];
  if (!cards.length) return _stopCardRetry();
  await Promise.allSettled(cards.map(c => enrichCard(c.closest('.comp-wrapper'), c.querySelector('.scv-lc-open')?.getAttribute('href') || '')));
  if (!document.querySelectorAll('.comp-wrapper .scv-link-card:not([data-scv-lc])').length) _stopCardRetry();
}

document.addEventListener('error', e => { // failed thumb paints broken-image glyph - swap to a transparent pixel
  const img = e.target;
  if (img?.tagName !== 'IMG' || !img.classList?.contains('scv-lc-thumb')) return;
  if (img.src.startsWith('data:image/gif')) return;
  img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
}, true);

const selectPasted = (added) => { // make pasted item active selection (handles + drag as unit, like harvested component)
  if (!added || !added.length) return;
  clearSelection();
  added.forEach(w => { selectEl(w); clearCachesIn(w); });
  updateSelectionDim();
};

document.addEventListener('paste', e => { // dispatch on system clipboard (last wins) - nodes-prefix, harvest, fallback
  const t = e.composedPath()[0]; // e.target is retargeted to shadow host across a shadow boundary - real focused el is first in path
  if (t?.tagName === 'INPUT' || t?.tagName === 'TEXTAREA' || t?.isContentEditable) return;
  const imgFile = (e.clipboardData?.files || [])[0];
  if (imgFile && imgFile.type.startsWith('image/')) { // clipboard bitmap > b64 img component (same import path as a harvest)
    e.preventDefault();
    setMode('edit');
    const rd = new FileReader();
    rd.addEventListener('load', ev => selectPasted(handlePasteData(imgWrapperMarkup(ev.target.result, _lastPointer.x, _lastPointer.y))));
    rd.readAsDataURL(imgFile);
    return;
  }
  const txt = (e.clipboardData || window.clipboardData).getData('text') || '';
  if (txt.startsWith(NODES_CLIP_PREFIX)) { // internal nodes (freshest, copy claimed clipboard)
    e.preventDefault();
    setMode('edit');
    try { _clipboardData = JSON.parse(txt.slice(NODES_CLIP_PREFIX.length)); } catch {} // cross-window paste works
    pasteSelected(_lastPointer.x, _lastPointer.y);
  } else if (looksLikeScvPayload(txt)) {
    e.preventDefault(); // harvested component - .scv - dashboard
    setMode('edit');
    handlePasteData(txt);
  } else if (/^\s*https?:\/\/\S+\s*$/.test(txt)) { // bare url > link card (imports instantly, quests enriches)
    e.preventDefault();
    setMode('edit');
    linkCard(txt, _lastPointer.x, _lastPointer.y);
  } else if (_clipboardData) { // fallback: clipboard write didn't land - same session
    e.preventDefault();
    setMode('edit');
    pasteSelected(_lastPointer.x, _lastPointer.y);
  }
});

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const files = e.dataTransfer.files;
  if (files.length) {
    const dropX = e.clientX, dropY = e.clientY; // capture before async read
    if (files[0].type.startsWith('image/')) { // image file > b64 img component (same import path as a pasted bitmap)
      setMode('edit');
      const rd = new FileReader();
      rd.addEventListener('load', ev => selectPasted(handlePasteData(imgWrapperMarkup(ev.target.result, dropX, dropY))));
      rd.readAsDataURL(files[0]);
      return;
    }
    const reader = new FileReader();
    reader.addEventListener('load', ev => {
      const text = ev.target.result;
      const isDashboard = /<scv-logic[\s>]/i.test(text) || text.includes('comp-wrapper'); // detect dashboard first then one node def
      if (!isDashboard && text.includes('data-scv-node')) {
        setMode('edit');
        const type = registerScvNodeFile(text); // updates def + re instantiates in place
        if (type && !document.querySelector('scv-logic[data-type="' + type + '"]')) {
          const x = (dropX + canvasContainer.scrollLeft) / session.zoom - 16;
          const y = (dropY + canvasContainer.scrollTop) / session.zoom - 16;
          const node = spawnLogicNode(type, x, y);
          session.tipMuted = node; // spawns under cursor - mute first hover-tooltip
          pushSpawnUndo(node, type);
        }
        return;
      }
      if (!isDashboard && text.includes('data-scv-comp')) { // composed component def - register type, spawn first instance if none placed (redrop just morphs placed ones)
        setMode('edit');
        const tag = registerComponentFile(text);
        if (tag && !document.querySelector(tag)) {
          const x = (dropX + canvasContainer.scrollLeft) / session.zoom - 16;
          const y = (dropY + canvasContainer.scrollTop) / session.zoom - 16;
          spawnComponent(tag, x, y);
        }
        return;
      }
      if (looksLikeScvPayload(text)) { setMode('edit'); handlePasteData(text); }
    });
    reader.readAsText(files[0]);
  }
});

// window + focus

window.addEventListener('resize', () => {
  _nodeCenters = new WeakMap();
  _nodeDims = new WeakMap();
  renderCables();
});

let _savedFocus = null;
document.addEventListener('focusin', e => {
  if (!e.composedPath().some(el => el?.closest?.('#canvas-container, scv-logic'))) return;
  const el = e.composedPath()[0];
  if (el && (el.isContentEditable || el.matches?.('scv-logic input'))) _savedFocus = el.isContentEditable ? el.textContent : el.value;
});

document.addEventListener('focusout', e => {
  if (!e.composedPath().some(el => el?.closest?.('#canvas-container, scv-logic'))) return;
  const el = e.composedPath()[0];
  if (el && (el.isContentEditable || el.matches?.('scv-logic input')) && _savedFocus !== null) {
    const newVal = el.isContentEditable ? el.textContent : el.value;
    const oldVal = _savedFocus;
    _savedFocus = null;
    if (oldVal !== newVal) {
      const applyEdit = (el, val) => { // restore value, then re-fire node's own input pipeline (emit + quest/segment config)
        if (el.isContentEditable) el.textContent = val;
        else el.value = val;
        el.dispatchEvent(new Event('input', { bubbles: true, composed: true })); // el may live inside a component's shadow root
      };
      pushUndo(
        () => applyEdit(el, newVal),
        () => applyEdit(el, oldVal),
        'edit ' + (oldVal.length > 20 ? oldVal.slice(0, 20) + '...' : oldVal)
      );
    }
  }
});

// context menu

function ctxLockClear() { session.ctxLockDir = null; } // clear ctrl-lock wiring direction

let _menuCloseHandler = null;
let _activeMenuOnClose = null; // current menu's onClose - fired when a newer menu replaces it (never dropped silently)

function showMenu(items, x, y, onClose) { // build and show context menu of items at (x,y) one open at a time
  if (_activeMenuOnClose) { try { _activeMenuOnClose(); } catch {} _activeMenuOnClose = null; } // replaced menu releases its lock (ctxLockDir etc)
  document.querySelectorAll('.cmenu').forEach(m => m.remove());
  if (_menuCloseHandler) { document.removeEventListener('click', _menuCloseHandler); _menuCloseHandler = null; }
  const menu = document.createElement('div');
  menu.className = 'cmenu';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  const dismissMenu = () => {
    if (!menu.parentNode) return;
    menu.remove();
    _activeMenuOnClose = null; // its onClose just fired below - a later replacement must not double-fire it
    if (_menuCloseHandler) { document.removeEventListener('click', _menuCloseHandler); _menuCloseHandler = null; }
    if (onClose) onClose();
  };
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'ctx-item' + (item.cls ? ' ' + item.cls : '');
    btn.textContent = item.label;
    btn.addEventListener('click', e => { item.fn(e); dismissMenu(); });
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);
  _activeMenuOnClose = onClose || null;
  _menuCloseHandler = e => { if (!menu.contains(e.target)) dismissMenu(); };
  const handler = _menuCloseHandler;
  setTimeout(() => document.addEventListener('click', handler), 0);
}

document.addEventListener('contextmenu', e => {
  e.preventDefault();
  tooltip.style.display = 'none';
  const items = [
    { label: session.mode === 'edit' ? '[mode] - use' : '[mode] - edit', cls: 'ctx-mode',
      fn: () => setMode(session.mode === 'edit' ? 'use' : 'edit') },
  ];
  if (session.isChainPending && session.lastSpawned) session.ctxLockDir = !!(e.ctrlKey || e.metaKey);
  nodeTypeList().forEach(type => {
    items.push({ label: '[node] - ' + type, fn: () => {
      setMode('edit');
      const wasChain = session.ctxLockDir !== null;
      const ctrl = wasChain ? session.ctxLockDir : false;
      session.ctxLockDir = null;
      session.isChainPending = false;
      const newNode = spawnLogicNode(type,
        (e.clientX + canvasContainer.scrollLeft) / session.zoom, (e.clientY + canvasContainer.scrollTop) / session.zoom);
      session.tipMuted = newNode; // spawns under cursor - mute first hover-tooltip
      const ls = session.lastSpawned;
      if (wasChain && ls) { if (ctrl) autoWire(newNode, ls); else autoWire(ls, newNode); }
      tempWire.classList.add('hidden');
      pushUndo(
        () => { zoomLayer.appendChild(newNode); renderCables(); },
        () => { newNode.remove(); renderCables(); },
        'spawn ' + type
      );
      session.lastSpawned = newNode;
    }});
  });
  compTypeList().forEach(tag => { // composed components sit below nodes, above save - click spawns instance
    items.push({ label: '[comp] - ' + tag.replace(/^scv-/, ''), fn: () => {
      setMode('edit');
      const w = spawnComponent(tag, (e.clientX + canvasContainer.scrollLeft) / session.zoom, (e.clientY + canvasContainer.scrollTop) / session.zoom);
      if (w) session.tipMuted = w;
    }});
  });
  items.push(
    { label: '[save] - quine (keeps editing)', cls: 'ctx-save', fn: saveQuine },
    { label: '[save] - publish (removes editing)', cls: 'ctx-save', fn: exportPublish }
  );
  showMenu(items, Math.min(e.clientX, window.innerWidth - 160), Math.min(e.clientY, window.innerHeight - 200), ctxLockClear);
});

// pointer hover tracking + keyboard shortcuts

canvasContainer.addEventListener('pointerover', e => {
  if (e.target.closest('scv-logic, .comp-wrapper'))
    session.chainHoverNode = e.target.closest('[data-scv-id], .comp-wrapper, scv-logic') || e.target;
});

canvasContainer.addEventListener('pointerout', e => {
  const rt = e.relatedTarget; // moving from a node to empty canvas must clear it too, not just leaving canvas
  if (!rt?.closest || !e.currentTarget.contains(rt) || !rt.closest('scv-logic, .comp-wrapper')) session.chainHoverNode = null;
});

document.addEventListener('keydown', e => {
  const _kt = e.composedPath()[0] || e.target; // real key target via composedPath - text shortcuts must not fire while typing
  const _typing = !!(_kt && ((_kt.closest && _kt.closest('input,textarea,select')) || _kt.isContentEditable));
  // tab toggles mode, but inside a harvested component moves between focusable elements - exempt those targets only
  const _inComponent = e.composedPath().some(n => n.classList && n.classList.contains('comp-wrapper'));
  const _tabInComp = _inComponent && _kt.closest && _kt.closest('button,a[href],summary,details,[tabindex],[contenteditable]');
  if (e.key === 'Escape') {
    document.querySelectorAll('.cmenu').forEach(m => m.remove());
    revertActiveDrag(); // every drag type back to pre-drag state + hides #drag-overlay + restores z-index lift
    if (session.lassoStart) { // an in-flight lasso is cancelled, not completed
      document.getElementById('lasso-box').style.display = 'none'; session.lassoStart = null;
    }
    restoreNodeOpacity();
    dragOverlay.style.cursor = '';
    tooltip.style.display = 'none';
    session.panState = null;
    clearSelection();
    tempWire.classList.add('hidden');
    session.chainHoverNode = null;
    session.isChainPending = false;
    session.ctxLockDir = null;
    closeIntro(); // esc dismisses ? overlay
  }
  if (e.key === '?' && !_typing) { e.preventDefault(); toggleIntro(); } // ? opens/closes intro menu overlay
  if ((e.key === 'Control' || e.key === 'Meta')
      && (session.isChainPending && session.lastSpawned || session.activeDrag && session.activeDrag.type === 'wire')) {
    if (session.ctxLockDir === null) {
      session.ctrlHeld = !!(e.ctrlKey || e.metaKey);
      tempWire.classList.toggle('cable-temp-reverse', session.ctrlHeld);
    }
  }
  if ((e.key === 'Backspace' || e.key === 'Delete') && !_typing) {
    e.preventDefault();
    if (selectedCount() > 0) deleteSelected();
  }
  if (e.key === 'Tab' && !_typing && !_tabInComp) {
    e.preventDefault();
    setMode(session.mode === 'edit' ? 'use' : 'edit');
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); saveQuine(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) { e.preventDefault(); exportPublish(); }
  // ctrl + c/v go through copy/paste listeners which read system clipboard - preventDefault would block paste
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && !e.shiftKey && !_typing) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && e.shiftKey && !_typing) { e.preventDefault(); redo(); } // ctrl+shift+z = 'Z' uppercase with shift held
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y') && !_typing) { e.preventDefault(); redo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A') && !_typing && session.mode === 'edit') { // select all - edit-mode only, selection is invisible in use mode
    e.preventDefault();
    clearSelection();
    getSelectableChildren().forEach(selectEl);
    updateSelectionDim();
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D') && !_typing) { // duplicate - same copy+paste machinery, offset like a cursor-less paste
    e.preventDefault(); // always suppress browser's own ctrl+d (bookmark), even with nothing selected
    if (selectedCount() > 0) { copySelected(); pasteSelected(null, null); }
  }
  if (e.key.startsWith('Arrow') && !_typing && !e.repeat && selectedCount() > 0) { // nudge selection - 1px, 10px with shift - one undo step per tap, not per os key-repeat
    e.preventDefault();
    const step = e.altKey ? GRID_STEP : e.shiftKey ? 10 : 1; // alt walks whole cells, shift coarse free move
    const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
    const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
    if (dx || dy) nudgeSelected(dx, dy, e.altKey);
  }
  // wiring is edit-mode gesture; don't arm invisibly in use mode
  if (!e.shiftKey && e.key === ' ' && !_typing && session.mode === 'edit' && !e.repeat) {
    e.preventDefault();
    const invert = !!(e.ctrlKey || e.metaKey);
    if (session.isChainPending && session.lastSpawned && session.chainHoverNode) {
      const target = toWiringNode(session.chainHoverNode);
      if (target && target !== session.lastSpawned) {
        if (invert) { autoWire(target, session.lastSpawned); } else { autoWire(session.lastSpawned, target); }
        tempWire.classList.add('hidden');
        session.isChainPending = false;
        return;
      }
    }
    if (session.lastSpawned) {
      session.isChainPending = true;
      tempWire.classList.remove('hidden');
      tempWire.classList.toggle('cable-temp-reverse', invert);
      const src = getNodeRect(session.lastSpawned);
      if (src) tempWire.setAttribute('d', bezierCurve(src.x, src.y, src.w, src.h,
        (_lastPointer.x + canvasContainer.scrollLeft) / session.zoom, (_lastPointer.y + canvasContainer.scrollTop) / session.zoom, 0, 0));
    }
  }
  // ctrl+digit is consumed only to spawn-and-reverse-wire while a chain is armed (deliberate invert gesture); outside a chain it falls through to browser tab-switch
  const _chainArmed = session.isChainPending && session.lastSpawned;
  if (!e.metaKey && !e.shiftKey && e.key >= '1' && e.key <= '9' && !_typing && !e.repeat && (!e.ctrlKey || _chainArmed)) {
    e.preventDefault();
    setMode('edit');
    const types = nodeTypeList();
    const type = types[parseInt(e.key) - 1];
    const node = spawnLogicNode(type,
      (_lastPointer.x + canvasContainer.scrollLeft) / session.zoom - 16,
      (_lastPointer.y + canvasContainer.scrollTop) / session.zoom - 16);
    session.tipMuted = node; // spawns under cursor - mute first hover-tooltip
    if (_chainArmed) {
      if (e.ctrlKey) autoWire(node, session.lastSpawned); else autoWire(session.lastSpawned, node); // ctrl inverts direction, same as space-chain gesture
      session.isChainPending = false;
    }
    tempWire.classList.add('hidden');
    session.lastSpawned = node;
    pushSpawnUndo(node, type);
  }
  if (!_typing && session.isChainPending && !e.ctrlKey && !e.metaKey && !e.shiftKey
      && e.key.length === 1 && e.key !== ' ' && !(e.key >= '1' && e.key <= '9')) {
    session.isChainPending = false;
    tempWire.classList.add('hidden');
  }
});

document.addEventListener('keyup', e => {
  if ((e.key === 'Control' || e.key === 'Meta')
      && (session.isChainPending && session.lastSpawned || session.activeDrag && session.activeDrag.type === 'wire')) {
    if (session.ctxLockDir === null) {
      session.ctrlHeld = !!(e.ctrlKey || e.metaKey);
      tempWire.classList.toggle('cable-temp-reverse', session.ctrlHeld);
    }
  }
});

// boot

function init() { // hydrate saved components, wire drag handles, render cables, open in edit mode
  expandCanvasWidth(0);
  expandCanvasHeight(0);
  const existing = [...canvasContainer.querySelectorAll('[data-scv-id]:not(scv-logic)')];
  if (existing.length) {
    [...new Set(existing.map(el => el.tagName.toLowerCase()))].forEach(tag => injectedScripts.add(tag));
    existing.forEach(hydrateComponentShadow); // hydrate each shadow per el (not promise), so broken tag degrades to structure-only
  }
  const _repopulateCompMenu = () => document.querySelectorAll('script[data-scv-comp]').forEach(s => { // repopulate composed-component menu from embedded defs (def ran on parse, this re-registers type)
    const tag = s.getAttribute('data-scv-tag') || (s.textContent.match(/customElements\.define\(['"]([^'"]+)['"]/) || [])[1];
    if (tag && !compTypes.has(tag)) defineComponentType(tag, s.textContent);
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _repopulateCompMenu, { once: true }); // embedded defs after this script - wait for full parse
  else _repopulateCompMenu();
  document.querySelectorAll('scv-logic').forEach(node => {
    if (!node.querySelector('.scv-logic-drag')) {
      const dragHandle = document.createElement('div');
      dragHandle.className = 'scv-logic-drag'; dragHandle.textContent = '+'; node.appendChild(dragHandle);
    }
    if (!node.querySelector('.scv-logic-del')) {
      const delBtn = document.createElement('button');
      delBtn.className = 'scv-logic-del'; delBtn.textContent = '✕'; node.appendChild(delBtn);
    }
  });
  renderCables(); // unconditional - doesn't depend on whenDefined resolving
  observeHostGeometry(zoomLayer); // redraw each cable once component host gains a box
  setupWorkshopChrome(); // empty-state hint + bg picker (studio only)
  setMode('edit'); // editor/quine opens ready to work (published pages use buildStandaloneRuntime, never this)
  enrichCards(); // silent upgrade: reopened quine re-fetches host-grade link cards once quests answers
}

// export

function _freezeField(live, target) { // bake live field value/checked/selected onto clone twine (cloneNode copies only attrs)
  if (!live || !target) return;
  if (live.tagName === 'INPUT') {
    if (live.type === 'checkbox' || live.type === 'radio') {
      if (live.checked) target.setAttribute('checked', ''); else target.removeAttribute('checked');
    } else target.setAttribute('value', live.value);
  } else if (live.tagName === 'TEXTAREA') {
    target.textContent = live.value;
  } else if (live.tagName === 'SELECT') {
    const lo = live.options, to = target.options;
    for (let k = 0; k < lo.length && k < to.length; k++) {
      if (lo[k].selected) to[k].setAttribute('selected', ''); else to[k].removeAttribute('selected');
    }
  }
}

function _captureShadowHTML(liveComp) { // clone component's live shadow to detached div, sys-style stripped + fields baked, one final serialize
  if (!liveComp || !liveComp.shadowRoot) return '';
  const temp = document.createElement('div');
  liveComp.shadowRoot.childNodes.forEach(n => temp.appendChild(n.cloneNode(true)));
  const sys = temp.querySelector('style[data-scv-sys]'); if (sys) sys.remove();
  const lf = liveComp.shadowRoot.querySelectorAll('input, textarea, select');
  const tf = temp.querySelectorAll('input, textarea, select');
  for (let i = 0; i < lf.length && i < tf.length; i++) _freezeField(lf[i], tf[i]);
  return temp.innerHTML;
}

function _shadowTemplate(liveComp, html = _captureShadowHTML(liveComp)) { // wrap component's frozen shadow in <template shadowrootmode> for publish - no class needed
  const tpl = document.createElement('template');
  tpl.setAttribute('shadowrootmode', 'open');
  tpl.innerHTML = html;
  return tpl;
}

function _freezeLogicInputsInto(liveRoot, cloneRoot) { // bake scv-logic input values onto clone, paired by document order
  const li = liveRoot.querySelectorAll('scv-logic input');
  const ci = cloneRoot.querySelectorAll('scv-logic input');
  for (let i = 0; i < li.length && i < ci.length; i++) _freezeField(li[i], ci[i]);
}

function _normalizeZIndexInto(liveRoot, cloneRoot) { // detached clone has no comp styles - copy z-index and inline onto clone twins
  const pack = (sel, base) => { // accepted: repacks comps + logic into two z-bands per save/load - cross-type drag stacking not kept
    const live = [...liveRoot.querySelectorAll(sel)], clone = [...cloneRoot.querySelectorAll(sel)];
    live.map((el, i) => ({ i, z: parseInt(getComputedStyle(el).zIndex) || 1 }))
        .sort((a, b) => a.z - b.z)
        .forEach((item, rank) => { if (clone[item.i]) clone[item.i].style.zIndex = base + rank; });
  };
  pack('.comp-wrapper', 1);
  pack('scv-logic', 100);
}

function _liveSelector(sel) {
  const hit = root => {
    if (!root || !root.querySelector) return false;
    try { if (root.querySelector(sel)) return true; } catch { return true; }
    let found = false;
    root.querySelectorAll('*').forEach(n => { if (!found && n.shadowRoot) found = hit(n.shadowRoot); });
    return found;
  };
  return hit(document);
}

function _defTagsOf(scriptEl) { // every tag the script defines - keeping one in use keeps the script
  const attr = scriptEl.getAttribute('data-scv-tag');
  if (attr) return [attr];
  return [...scriptEl.textContent.matchAll(/customElements\.define\(['"]([^'"]+)['"]/g)].map(m => m[1]);
}

function _nodeDefInUse(src) { // every name the source declares - a nested one must not decide for the def
  const names = [...src.matchAll(/name:\s*['"]([^'"]+)['"]/g)].map(m => m[1]);
  if (!names.length) return true;
  return names.some(n => _liveSelector('scv-logic[data-type="' + n.replace(/"/g, '\\"') + '"]'));
}

function _pruneUnusedDefs(root) {
  root.querySelectorAll('script[data-scv-def]').forEach(s => {
    const tags = _defTagsOf(s);
    if (tags.length && !tags.some(_liveSelector)) s.remove();
  });
  root.querySelectorAll('script[data-scv-node]').forEach(s => {
    if (!_nodeDefInUse(s.textContent)) s.remove();
  });
}

function _downloadDoc(html, name) { // serialize + download a built document with a timestamped filename
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const date = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  const time = `${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`;
  a.download = `${name.replace(/\s+/g, '-')}-${date}-${time}.html`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 100);
}

async function toBase64(url) { // fetch url and resolve to base64 data: url (returns url unchanged on failure)
  if (!url || url.startsWith('data:') || url.startsWith('blob:')) return url;
  try {
    const response = await fetch(url, { mode: 'cors' });
    const blob = await response.blob();
    return await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch { console.warn('toBase64 fail'); return url; }
}

async function _embedAssets(root) { // inline every remote <img src> under root as base64 data: url (offline-forever promise)
  const cache = new Map(); // a shared remote image is fetched once, not once per <img>
  const imgs = [], sets = [];
  const collect = r => {
    if (!r || !r.querySelectorAll) return;
    imgs.push(...r.querySelectorAll('img[src]'));
    sets.push(...r.querySelectorAll('img[srcset], source[srcset]'));
    r.querySelectorAll('template').forEach(t => collect(t.content));
  };
  collect(root);
  const grab = async u => { if (!cache.has(u)) cache.set(u, toBase64(u)); return cache.get(u); };
  await Promise.allSettled(imgs.map(async img => {
    const src = img.getAttribute('src');
    if (src && !src.startsWith('data:') && !src.startsWith('blob:')) {
      const b64 = await grab(src);
      if (b64) img.setAttribute('src', b64);
    }
  }));
  await Promise.allSettled(sets.map(async n => { // srcset outranks src, remote candidate list defeats inlined src
    const v = n.getAttribute('srcset');
    if (!v || v.includes('data:')) return;
    const cands = v.split(',').map(p => p.trim()).filter(Boolean)
      .map(p => { const b = p.split(/\s+/); return { url: b[0], desc: b.slice(1).join(' ') }; });
    const done = await Promise.all(cands.map(async c =>
      (!c.url || c.url.startsWith('blob:')) ? c : { url: (await grab(c.url)) || c.url, desc: c.desc }));
    n.setAttribute('srcset', done.map(c => c.url + (c.desc ? ' ' + c.desc : '')).join(', '));
  }));
}

async function saveQuine() { // export editor + state as self-restoring quine, built entirely on a detached clone
  revertActiveDrag(); // a mid-drag serialization would bake transform into clone (ctrl + s unguarded)
  const clone = document.documentElement.cloneNode(true); // clone first, everything below mutates clone
  const liveRoot = document.documentElement;

  // not clonable live state > clone twins
  _freezeLogicInputsInto(liveRoot, clone);
  _normalizeZIndexInto(liveRoot, clone);

  // components: bake frozen live shadow into clone twin, reduce to just that
  const liveComps = liveRoot.querySelectorAll('[data-scv-id]:not(scv-logic)');
  const cloneComps = clone.querySelectorAll('[data-scv-id]:not(scv-logic)');
  for (let i = 0; i < liveComps.length && i < cloneComps.length; i++) {
    const cc = cloneComps[i];
    cc.innerHTML = '';
    const html = _captureShadowHTML(liveComps[i]);
    if (!html) continue;
    // authored comp ships declarative shadow - hydration reattaches before upgrade, constructor reruns script + rebinds listeners; harvested stays inert
    if (liveComps[i].hasAttribute('data-scv-emitter')) { cc.appendChild(_shadowTemplate(liveComps[i], html)); }
    else { const tpl = document.createElement('template'); tpl.className = 'custom-shadow'; tpl.innerHTML = html; cc.appendChild(tpl); }
  }

  clone.querySelectorAll('.cmenu').forEach(m => m.remove()); // chrome + scale on clone (reopened quine's init() sets mode)
  clone.querySelectorAll('[id^="scv-"]').forEach(n => n.remove()); // strip bookmarklet ui so save doesn't export it
  clone.querySelectorAll('.selected, .dimmed, .wire-danger, .node-pulse, .scv-node-error') // strip transient interaction classes
       .forEach(n => n.classList.remove('selected', 'dimmed', 'wire-danger', 'node-pulse', 'scv-node-error'));
  clone.querySelectorAll('.scv-logic-float').forEach(n => n.remove()); // value bubble is 600ms fade - saving mid-fade pins stale number nothing clears
  clone.querySelectorAll('[class=""]').forEach(n => n.removeAttribute('class')); // classList.remove leaves empty attr behind - export should not carry it
  const cloneTemp = clone.querySelector('#temp-wire'); if (cloneTemp) cloneTemp.setAttribute('d', 'M 0 0');
  const cloneCables = clone.querySelector('#static-cables'); if (cloneCables) cloneCables.innerHTML = ''; // init() re-renders every cable, so serializing only bloats and drifts
  const cloneLasso = clone.querySelector('#lasso-box'); if (cloneLasso) cloneLasso.style.display = 'none';
  const zl = clone.querySelector('#zoom-layer'); if (zl) zl.style.transform = 'scale(1)';
  const overlay = clone.querySelector('#drag-overlay'); if (overlay) overlay.style.display = 'none';
  const tip = clone.querySelector('#wiring-tooltip'); if (tip) tip.style.display = 'none';
  clone.querySelectorAll('#intro-menu, #intro-backdrop, #bg-dot').forEach(n => n.remove()); // workshop chrome recreated on load
  clone.style.removeProperty('--background-grid'); // grid color re-derived from --background-sunk on load
  clone.querySelectorAll('[data-scv-appended]').forEach(n => n.remove()); // init()-spawned (ctx.append) recreated on load

  _pruneUnusedDefs(clone); // clone only - live document keeps every def, so undo restores deleted component intact
  const titleEl = clone.querySelector('title'); if (titleEl) titleEl.textContent = QUINE_NAME;
  clone.setAttribute('data-scv-runtime', SCV_VERSION); // version stamp (clone)

  await _embedAssets(clone);

  clone.querySelectorAll('head > script').forEach(s => { if (/^\s*window\.__QUEST_API__\s*=/.test(s.textContent)) s.remove(); }); // else each save stacks another override on last
  if (window.__QUEST_API__) {
    const apiOverride = document.createElement('script');
    apiOverride.textContent = `window.__QUEST_API__=${JSON.stringify(window.__QUEST_API__)};`;
    clone.querySelector('head').insertBefore(apiOverride, clone.querySelector('head').firstChild);
  }
  [...new Set(nodeDefScripts || [])].filter(_nodeDefInUse).forEach(src => { // embed custom node defs so reopened quine re-registers them
    const s = document.createElement('script'); s.setAttribute('data-scv-node', ''); s.textContent = src;
    clone.querySelector('body').appendChild(s);
  });

  _downloadDoc('<!DOCTYPE html>  <!-- scavenge.ar - © 2026 octantes.ar - SPDX-License-Identifier: Apache-2.0 -->\n\n' + clone.outerHTML, QUINE_NAME);
}

function _nodeDefSources() { // custom node def sources in use - nodeDefScripts is primary, but reopened quine never repopulates, so gather live nodes too
  return [...new Set([
    ...(nodeDefScripts || []),
    ...[...document.querySelectorAll('script[data-scv-node]')].map(s => s.textContent),
  ])].filter(_nodeDefInUse);
}

function buildStandaloneRuntime() { // published runtime: factories .toString()-embedded + wired - change propagates
  const nodeDefs = _nodeDefSources().join('\n');
  return `/* scavenger runtime v${SCV_VERSION} - auto-generated from the editor's source.
   the factories below are .toString()-embedded from the running
   dashboard; the published artifact runs the exact same code that powers
   the editor's wiring engine, master clock, and scv-logic node behaviour. */
(() => {
  const _qsQ = new URLSearchParams(window.location.search);
  const _qsApi = _qsQ.get('quest-api');
  if (_qsApi) { window.__QUEST_API__ = _qsApi; }
  const splitWords = ${splitWords.toString()};
  const uid = ${uid.toString()};
  const px = ${px.toString()};
  ${calcInputWidth.toString()} // shared helper: defineScavLogic sizes its input with it
  ${createScavRouter.toString()}
  ${createScavClock.toString()}
  ${createScavQuestClient.toString()}
  ${defineScavLogic.toString()}
  ${defineScavNode.toString()}

  const _scvClock = createScavClock();
  const _router = createScavRouter({ preventDefault: true });
  defineScavLogic({
    routeSend: (ch, val) => _router.routeSend(ch, val),
    applyActionToReceivers: (verb, ch, val) => _router.applyActionToReceivers(verb, ch, val),
    clockRegister: node => _scvClock.register(node),
    clockUnregister: node => _scvClock.unregister(node),
    questWrite: (method, url, body) => {
      const opts = { method };
      if (body !== undefined) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
      return fetch(url, opts); // rejection propagates - write to down server must retry, not silently vanish
    }
  });
  const defineNode = defineScavNode;
  window.routeSend = (ch, val) => _router.routeSend(ch, val); // host-facing injection handle: same semantics as a user-gesture emit, scoped to the published _router
  ${nodeDefs}
})();`;
}

async function exportPublish() { // export runtime + state as published artifact, assembled in fresh detached document
  revertActiveDrag(); // mid-drag serialization would bake transform into clone
  let maxRight = 0, maxBottom = 0; const PAD = 20;
  document.querySelectorAll('.comp-wrapper, scv-logic').forEach(el => { // content bounding box from unzoomed live reads
    const l = px(el, 'left'), t = px(el, 'top');
    const r = el.getBoundingClientRect(); // visual size, unlike offsetWidth/Height it includes css scale transform
    maxRight = Math.max(maxRight, l + r.width / session.zoom);
    maxBottom = Math.max(maxBottom, t + r.height / session.zoom);
  });
  maxRight += PAD; maxBottom += PAD;

  const doc = document.implementation.createHTMLDocument(PUBLISH_NAME);
  doc.documentElement.setAttribute('lang', 'en'); // open <html lang="en"> like every other artifact - a fresh doc has no lang
  doc.documentElement.setAttribute('data-scv-runtime', SCV_VERSION); // version stamp
  const liveBg = document.documentElement.style.getPropertyValue('--background-sunk').trim(); // carry user's chosen background
  if (liveBg) doc.documentElement.style.setProperty('--background-sunk', liveBg);
  const body = doc.body;
  // carry harvested component's head deps (style/link/script[src]) so it publishes with real fonts/libs
  document.querySelectorAll('style:not([id^="scv-"]), link:not([id^="scv-"]), script[src]:not([id^="scv-"])').forEach(el => doc.head.appendChild(el.cloneNode(true)));

  // scv-logic nodes still run (router + clock) in a publish, they just don't render
  const hideLogic = doc.createElement('style');
  hideLogic.textContent = 'scv-logic { display: none !important; }';
  doc.head.appendChild(hideLogic);

  // content-sized spacer defines scroll extent (no drag/growth logic in a publish)
  const container = doc.createElement('div');
  container.id = 'canvas-container';
  const spacer = doc.createElement('div');
  spacer.style.cssText = `position:relative;width:${maxRight}px;height:${maxBottom}px;pointer-events:none`;
  container.appendChild(spacer);

  document.querySelectorAll('.comp-wrapper').forEach(wrapper => {
    if (wrapper.dataset.scvAppended) return; // recreated by node's init() on load
    if (wrapper.parentElement?.closest('.comp-wrapper')) return; // nested wrappers ship inside their parent's clone - skip standalone copy (closest would match wrapper itself)
    const liveHost = wrapper.querySelector('[data-scv-id]');
    const cloned = wrapper.cloneNode(true); // wrapper + host (inline styles including toggle state) + editor chrome
    cloned.querySelectorAll('.comp-handles, .comp-drag-edge').forEach(n => n.remove()); // strip editor-only chrome
    const host = cloned.querySelector('[data-scv-id]');
    // re-attach live shadow declaratively (flattening loses :host/slots/scoping) - prepend to keep slots
    if (liveHost && host && liveHost.shadowRoot) host.prepend(_shadowTemplate(liveHost));
    // freeze nested scv-logic input values (cloneNode copies attr, not live .value) - loop below skips them
    const _liveL = wrapper.querySelectorAll('scv-logic'), _cloneL = cloned.querySelectorAll('scv-logic');
    for (let i = 0; i < _liveL.length && i < _cloneL.length; i++) {
      const li = _liveL[i].querySelector('.scv-logic-input'), ci = _cloneL[i].querySelector('.scv-logic-input');
      if (li && ci) ci.setAttribute('value', li.value);
    }
    container.appendChild(cloned);
  });

  document.querySelectorAll('scv-logic').forEach(node => { // standalone scv-logic: clone + freeze input value (nested ones above)
    if (node.closest('.comp-wrapper')) return;
    const c = node.cloneNode(true);
    const li = node.querySelector('.scv-logic-input'), ci = c.querySelector('.scv-logic-input');
    if (li && ci) ci.setAttribute('value', li.value);
    container.appendChild(c);
  });

  body.appendChild(container);
  doc.documentElement.querySelectorAll('.selected, .dimmed, .wire-danger, .node-pulse, .scv-node-error') // strip transient interaction classes, mirroring saveQuine
    .forEach(n => n.classList.remove('selected', 'dimmed', 'wire-danger', 'node-pulse', 'scv-node-error'));
  doc.documentElement.querySelectorAll('.scv-logic-float').forEach(n => n.remove()); // same transient bubble - create on demand, so dropping loses nothing
  doc.documentElement.querySelectorAll('[class=""]').forEach(n => n.removeAttribute('class')); // same empty attrs, mirroring saveQuine
  await _embedAssets(doc.documentElement); // inline remote imgs to base64, same as saveQuine (offline-forever promise)
  // defs after components, never in head - def running first upgrades host before declarative shadow parses
  document.querySelectorAll('script[data-scv-def]').forEach(def => { const t = _defTagsOf(def); if (!t.length || t.some(_liveSelector)) body.appendChild(def.cloneNode(true)); });
  // ship node defs loose too - lets pasted publish re-register nodes, parity with components + quine
  _nodeDefSources().forEach(src => { const s = doc.createElement('script'); s.setAttribute('data-scv-node', ''); s.textContent = src; body.appendChild(s); });
  const runtime = doc.createElement('script');
  runtime.textContent = buildStandaloneRuntime();
  body.appendChild(runtime);

  _downloadDoc('<!DOCTYPE html>  <!-- scavenge.ar - © 2026 octantes.ar - SPDX-License-Identifier: Apache-2.0 -->\n\n' + doc.documentElement.outerHTML, PUBLISH_NAME);
}

init();
