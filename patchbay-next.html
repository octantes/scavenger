<html lang="en" data-scv-runtime="2.0.0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>patchbay</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="%23986c98"/></svg>'>
<style id="scv-runtime-css">
:root { /* theme enforced by token tests */

  --font-mono: 'SF Mono', 'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace;

  --output:            #986C98;
  --input:             #8AB6BB;
  --danger:            #985954;
  --success:           #6FAC67;

  --background-sunk:   #1A1C1C;
  --background-raised: #252727;

  --background-grid:   rgba(255,255,255,0.06);

  --text-danger:       #FFFFFF;
  --text-base:         #AAABAC;
  --text-dim:          #888888;
  --text-faint:        #666666;

  --border:            #3A3C3C;

  --corner-low:        5px;
  --corner-high:       8px;

  --ease-out:          cubic-bezier(.25,.46,.45,.94);
  --ease-swift:        cubic-bezier(.25,.75,.45,1.0);

  --duration-fast:     .15s;
  --duration-base:     .20s;
  --duration-slow:     .35s;

  --fs-a:              12px;
  --fs-b:              13px;
  --fs-c:              14px;
  --fs-d:              16px;

  --cable:             var(--output);
  --action:            var(--text-faint);
  --variable:          var(--output);

  --selection:         rgba(138, 182, 187, 0.15);
  --dim:               color-mix(in srgb, var(--output) 50%, var(--background-sunk)); /* opaque, prevents cable show through */

}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--background-sunk); color: var(--text-base); font-family: var(--font-mono); font-size: var(--fs-b); }
</style>
<script id="scv-runtime">
(() => {
'use strict';
if (customElements.get('scv-patchbay')) return; // one definition per page

const ATTR_EMITS = 'data-scv-emits', ATTR_RECEIVES = 'data-scv-receives', ATTR_ACTION = 'data-scv-action';
const WIRING_SEL = `[${ATTR_EMITS}],[${ATTR_RECEIVES}],[${ATTR_ACTION}]`;
const COMPOUND_VERBS = ['prop', 'method', 'event'];
const splitWords = s => (s || '').split(/\s+/).filter(Boolean);
const uid = (len = 8) => Math.random().toString(36).slice(2, 2 + len);
const px = (el, prop) => parseFloat(el.style[prop]) || 0;

const _debugSeen = new Set();
const debug = (msg, err, once) => { // swallowed failure, verbose level only
  if (once) { if (_debugSeen.has(msg)) return; _debugSeen.add(msg); }
  console.debug('[scav] ' + msg, err);
};

const channelOf = token => { const [verb, a1, a2] = token.split(':'); return COMPOUND_VERBS.includes(verb) ? a2 : a1; }; // verb:ch or verb:arg:ch
const collectChannels = (el, emits, recvs) => {
  splitWords(el.getAttribute(ATTR_EMITS)).forEach(c => emits.add(c));
  splitWords(el.getAttribute(ATTR_RECEIVES)).forEach(c => recvs.add(c));
  splitWords(el.getAttribute(ATTR_ACTION)).forEach(t => { const c = channelOf(t); if (c) recvs.add(c); });
};
const hostOf = el => el?.getRootNode?.()?.host || null;
const _up = (el, tag) => { for (let n = el; n; n = n.parentElement || hostOf(n)) if (n.localName === tag) return n; return null; }; // crosses shadow roots
const itemOf = el => _up(el, 'scv-item');
const patchbayOf = el => _up(el, 'scv-patchbay');

const PULSE = Symbol.for('scv.pulse');
const pulse = (t = performance.now()) => Object.freeze({ [PULSE]: true, t }); // t: grid time it was due
const isPulse = v => v != null && v[PULSE] === true;

const _frameJobs = new Map();
let _frameRaf = 0;
const onFrame = (key, fn) => { // last write per key, once per frame
  _frameJobs.set(key, fn);
  if (!_frameRaf) _frameRaf = requestAnimationFrame(() => {
    _frameRaf = 0;
    const jobs = [..._frameJobs.values()]; _frameJobs.clear();
    for (const job of jobs) { try { job(); } catch (e) { debug('frame job failed', e, true); } }
  });
};

const _shared = new Map(); // key > { value, users, release }
const shared = (key, create, release) => { // one per page, released by last user
  let s = _shared.get(key);
  if (!s) { s = { value: create(), users: 0, release }; _shared.set(key, s); }
  s.users++;
  return s.value;
};
const unshare = key => {
  const s = _shared.get(key); if (!s) return;
  if (--s.users > 0) return;
  _shared.delete(key);
  try { s.release?.(s.value); } catch (e) { debug('shared release failed', e); }
};
const whenGone = (el, fn) => requestAnimationFrame(() => { if (!el.isConnected) fn(); }); // disconnect also fires on moves

// assets: bytes once in document, blobs live, refs elsewhere

const ASSET_REF = 'scv-asset:';
const _assets = { byHash: new Map(), decoded: new WeakMap() }; // hash > { blob, url, type }
const _hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const _fnv = bytes => { // fallback hash where crypto.subtle is missing - two 32-bit fnv-1a lanes
  let a = 0x811c9dc5, b = 0x01000193 ^ bytes.length;
  for (let i = 0; i < bytes.length; i++) { a = Math.imul(a ^ bytes[i], 16777619); b = Math.imul(b ^ bytes[i], 2246822507); }
  return (a >>> 0).toString(16).padStart(8, '0') + (b >>> 0).toString(16).padStart(8, '0') + bytes.length.toString(16);
};
const _b64ToBytes = b64 => { const s = atob(b64.replace(/\s+/g, '')); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; };
const _bytesToB64 = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const asset = {
  async put(blob) { // same bytes, same ref
    const buf = await blob.arrayBuffer();
    const hash = crypto.subtle ? _hex(await crypto.subtle.digest('SHA-256', buf)).slice(0, 32) : _fnv(new Uint8Array(buf));
    if (!_assets.byHash.has(hash)) {
      _assets.byHash.set(hash, { blob, url: URL.createObjectURL(blob), type: blob.type || 'application/octet-stream' });
      _cssVar(hash);
    }
    return ASSET_REF + hash;
  },
  hashOf: ref => String(ref || '').startsWith(ASSET_REF) ? String(ref).slice(ASSET_REF.length) : null,
  url(ref) { return _assets.byHash.get(asset.hashOf(ref))?.url || null; },
  blob(ref) { return _assets.byHash.get(asset.hashOf(ref))?.blob || null; },
  decode(ref, fn) { // once per page per decoder
    let byRef = _assets.decoded.get(fn); if (!byRef) _assets.decoded.set(fn, byRef = new Map());
    if (!byRef.has(ref)) byRef.set(ref, Promise.resolve(asset.blob(ref)?.arrayBuffer()).then(b => b && fn(b)));
    return byRef.get(ref);
  },
  boot(root = document) { // table > blobs, base64 dropped from live dom
    root.querySelectorAll('script[type="scv/asset"]').forEach(s => {
      const hash = s.dataset.hash;
      if (hash && !_assets.byHash.has(hash) && s.textContent) {
        try {
          const blob = new Blob([_b64ToBytes(s.textContent)], { type: s.dataset.type || 'application/octet-stream' });
          _assets.byHash.set(hash, { blob, url: URL.createObjectURL(blob), type: blob.type });
        } catch (e) { debug('asset table entry unreadable, skipped', e); }
      }
      s.textContent = '';
      if (hash) _cssVar(hash);
    });
    document.querySelectorAll('scv-patchbay').forEach(resolveRefs);
  },
  async element(hash) {
    const a = _assets.byHash.get(hash); if (!a) return '';
    const b64 = _bytesToB64(new Uint8Array(await a.blob.arrayBuffer()));
    return `<script type="scv/asset" data-hash="${hash}" data-type="${a.type.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}">${b64}<\/script>\n`;
  },
};
const _assetSheet = new CSSStyleSheet(); // adopted by every patchbay shadow - css reads var, never serialized
const _cssVars = new Set();
const _cssVar = hash => {
  const url = _assets.byHash.get(hash)?.url;
  if (!url || _cssVars.has(hash)) return;
  _cssVars.add(hash);
  _assetSheet.insertRule(`:host { --scv-asset-${hash}: url("${url}"); }`, _assetSheet.cssRules.length);
};
const resolveRefs = root => { // data-scv-src > src, through shadows
  const walk = r => {
    r.querySelectorAll('[data-scv-src]').forEach(el => { const u = asset.url(el.dataset.scvSrc); if (u && el.getAttribute('src') !== u) el.setAttribute('src', u); });
    r.querySelectorAll('*').forEach(n => { if (n.shadowRoot && n.localName !== 'scv-logic') walk(n.shadowRoot); });
  };
  if (root.matches?.('[data-scv-src]')) { const u = asset.url(root.dataset.scvSrc); if (u) root.setAttribute('src', u); }
  walk(root);
};

// one router per patchbay - values travel channels named in wiring attributes

const PRIMITIVE = new Set(['string', 'number', 'boolean']);
const FORM_TAGS = new Set(['INPUT', 'TEXTAREA', 'SELECT']);
const NODE_VERBS = new Set(['toggle', 'hide', 'show', 'increment', 'decrement']); // a node acts on these itself
const _emitters = new WeakSet(); // script emits for these - native listeners skip them

const createRouter = (root, {
  shouldRoute = () => true,
  onRoute     = () => {},
} = {}) => {
  let _depth = 0;
  let _cache = null; // channel > receivers in walk order

  const invalidate = () => { _cache = null; };
  const _observer = new MutationObserver(invalidate);
  const _observed = new WeakSet();
  const _observe = (r, childList) => {
    if (_observed.has(r)) return;
    _observed.add(r);
    _observer.observe(r, { subtree: true, childList, attributes: true, attributeFilter: [ATTR_EMITS, ATTR_RECEIVES, ATTR_ACTION] });
  };
  _observe(root, true); // shadows watch wiring attrs only - text churn must not drop cache every frame

  const _rebuild = () => { // light dom first, then component shadows by host
    const cache = new Map();
    const walk = r => {
      r.querySelectorAll(`[${ATTR_RECEIVES}],[${ATTR_ACTION}]`).forEach(n => {
        const chs = new Set(splitWords(n.getAttribute(ATTR_RECEIVES))); // receive + action on one channel fires once
        splitWords(n.getAttribute(ATTR_ACTION)).forEach(t => { const c = channelOf(t); if (c) chs.add(c); });
        chs.forEach(c => { if (!cache.has(c)) cache.set(c, []); cache.get(c).push(n); });
      });
      r.querySelectorAll('*').forEach(n => {
        if (!n.shadowRoot || n.localName === 'scv-logic') return;
        _observe(n.shadowRoot, false); walk(n.shadowRoot);
      });
    };
    walk(root);
    return cache;
  };

  const _applyVerb = (node, verb, arg, value) => {
    try {
      if (!arg) return;
      if (verb === 'prop') {
        const v = value !== undefined ? value : '';
        if (!arg.startsWith('style.')) return node[arg] = v;
        const p = arg.slice(6);
        p.startsWith('--') ? node.style.setProperty(p, v) : node.style[p] = v;
      }
      else if (verb === 'method' && typeof node[arg] === 'function') node[arg](value);
      else if (verb === 'event') node.dispatchEvent(new CustomEvent(arg, { detail: value, bubbles: true, cancelable: true, composed: true }));
    } catch (e) { console.warn('[scav] verb ' + verb + ':' + arg + ' failed', e); }
  };

  const _hide = node => {
    if (!node.dataset.scvOrigDisplay) node.dataset.scvOrigDisplay = getComputedStyle(node).display;
    node.style.display = 'none';
  };
  const _show = node => { node.style.display = node.dataset.scvOrigDisplay || 'block'; };
  const _toggle = node => getComputedStyle(node).display === 'none' ? _show(node) : _hide(node);

  const _applyMacroVerb = (node, verb) => {
    if (node.localName === 'scv-logic' && NODE_VERBS.has(verb)) return node.act?.(verb);
    switch (verb) {
      case 'clone': {
        const unit = node.closest('scv-item') || node; // whole item, else in place
        const clone = unit.cloneNode(true);
        const strip = n => [ATTR_EMITS, ATTR_RECEIVES, ATTR_ACTION].forEach(a => n.removeAttribute(a));
        strip(clone); clone.querySelectorAll(WIRING_SEL).forEach(strip);
        clone.querySelectorAll('[data-scv-id]').forEach(n => { n.dataset.scvId = 'imp_' + uid(9); });
        if (clone.matches('[data-scv-id]')) clone.dataset.scvId = 'imp_' + uid(9);
        if (unit !== node || node.localName === 'scv-logic') { clone.style.left = px(unit, 'left') + 24 + 'px'; clone.style.top = px(unit, 'top') + 24 + 'px'; }
        unit.after(clone);
        return;
      }
      case 'delete': (node.closest('scv-item') || node).remove(); return invalidate();
      case 'toggle': return _toggle(node);
      case 'hide':   return _hide(node);
      case 'show':   return _show(node);
      case 'increment':
      case 'decrement': {
        const form = FORM_TAGS.has(node.tagName);
        const v = (Number(form ? node.value : node.textContent) || 0) + (verb === 'increment' ? 1 : -1);
        form ? (node.value = v) : (node.textContent = v);
        node.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        return node.dispatchEvent(new CustomEvent('scv-receive', { detail: v, bubbles: true, composed: true }));
      }
    }
  };

  const _runAction = (node, channel, value, isRecv) => { // bare tokens fire on any received channel
    splitWords(node.getAttribute(ATTR_ACTION)).forEach(token => {
      const [verb, a1] = token.split(':');
      const ch = channelOf(token);
      if (ch === channel || (isRecv && !ch)) COMPOUND_VERBS.includes(verb) ? _applyVerb(node, verb, a1 || '', value) : _applyMacroVerb(node, verb);
    });
  };

  const _write = (node, value) => { // primitives only - objects and pulses by event
    if (!PRIMITIVE.has(typeof value)) return;
    if (FORM_TAGS.has(node.tagName) && (node.type === 'checkbox' || node.type === 'radio')) node.checked = [true, 1, '1', 'true', 'on', 'checked'].includes(value);
    else if (FORM_TAGS.has(node.tagName)) node.value = value; // text would wipe select options
    else node.textContent = value;
  };

  const _deliver = (node, channel, value) => {
    const isRecv = splitWords(node.getAttribute(ATTR_RECEIVES)).includes(channel);
    if (isRecv) {
      if (node.localName === 'scv-logic') node.receive?.(value, channel);
      else {
        _write(node, value);
        const ev = new CustomEvent('scv-receive', { detail: value, bubbles: true, composed: true });
        ev.channel = channel;
        node.dispatchEvent(ev); // before own verb
        if (_depth < 20) splitWords(node.getAttribute(ATTR_EMITS)).forEach(c => { if (c !== channel) routeSend(c, value); }); // pass through, never back out incoming channel
      }
    }
    _runAction(node, channel, value, isRecv);
  };

  const routeSend = (channel, value) => {
    if (_depth >= 20) return console.warn('[scav] depth limit (20) reached on ' + channel + ', chain stopped');
    _depth++;
    try {
      try { onRoute(channel, value); } catch (e) { debug('onRoute failed', e, true); }
      _cache ??= _rebuild();
      _cache.get(channel)?.forEach(n => _deliver(n, channel, value));
    } finally { _depth--; }
  };

  const applyAction = (verb, channel, value) => { // action node: verb on every receiver of channel
    _cache ??= _rebuild();
    _cache.get(channel)?.forEach(node => {
      const isRecv = splitWords(node.getAttribute(ATTR_RECEIVES)).includes(channel);
      const listed = splitWords(node.getAttribute(ATTR_ACTION)).some(t => t.split(':')[0] === verb && (channelOf(t) === channel || !channelOf(t)));
      if (isRecv) {
        const [v, arg] = verb.split(':');
        if (COMPOUND_VERBS.includes(v)) _applyVerb(node, v, arg || '', value);
        else if (!listed) _applyMacroVerb(node, verb); // listed verbs fire once, below
      }
      _runAction(node, channel, value, isRecv);
    });
  };

  const _source = e => { // closest emitter wins
    for (const n of e.composedPath()) {
      if (n === root) return null;
      if (n.nodeType !== 1) continue;
      if (n.localName === 'scv-logic' || _emitters.has(n)) return null;
      if (n.hasAttribute(ATTR_EMITS)) return n;
    }
    return null;
  };
  const _origin = e => e.composedPath().find(n => n.nodeType === 1 && (n.value !== undefined || n.isContentEditable)) || e.composedPath()[0];
  const _valueOf = n => n.value !== undefined ? n.value : n.textContent;
  const _fan = (src, value) => splitWords(src.getAttribute(ATTR_EMITS)).forEach(c => routeSend(c, value));

  root.addEventListener('click', e => {
    if (!shouldRoute('click')) return;
    const src = _source(e); if (!src) return;
    if (src.type !== 'checkbox' && src.type !== 'radio') { e.preventDefault(); e.stopPropagation(); } // wired link must not navigate
    const n = _origin(e);
    if (n.type === 'radio') return; // change carries pick, keyboard included
    _fan(src, n.type === 'checkbox' ? (n.checked ? 1 : 0) : _valueOf(n));
  });
  root.addEventListener('input', e => {
    if (!shouldRoute('input')) return;
    const src = _source(e); if (!src) return;
    const n = _origin(e);
    if (n.type === 'checkbox' || n.type === 'radio') return; // click routed post-toggle 1/0
    _fan(src, _valueOf(n));
  });
  root.addEventListener('change', e => { // select commits on change
    if (!shouldRoute('change')) return;
    const src = _source(e); if (!src) return;
    const n = _origin(e);
    if (n.type === 'checkbox') return;
    _fan(src, _valueOf(n));
  });
  root.addEventListener('keyup', e => {
    if (!shouldRoute('keyup')) return;
    const src = _source(e); if (!src) return;
    const n = _origin(e);
    if (FORM_TAGS.has(n.tagName) || n.tagName === 'BUTTON' || n.isContentEditable) return; // input, change or click already routed it
    _fan(src, n.textContent);
  });
  root.addEventListener('scv-emit', e => { // from el or nearest wired ancestor
    if (!shouldRoute('scv-emit')) return;
    const src = e.composedPath().find(n => n.nodeType === 1 && n.hasAttribute(ATTR_EMITS));
    if (src && src !== root) _fan(src, e.detail);
  });

  return { routeSend, applyAction, invalidate };
};

// one page-wide timer for earliest due clock - idle page never wakes

const clock = (() => {
  const _nodes = new Set(); // registration order = firing order
  let _timer = 0, _at = Infinity;
  const _slot = (now, ms, off) => Math.ceil((now - off) / ms) * ms + off; // next grid slot at or after now

  const _arm = () => {
    let next = Infinity;
    for (const n of _nodes) if (n._clkNext < next) next = n._clkNext;
    if (next === _at) return;
    clearTimeout(_timer); _timer = 0; _at = next;
    if (next < Infinity) _timer = setTimeout(_fire, Math.max(0, Math.ceil(next - performance.now())));
  };

  const _fire = () => {
    _timer = 0; _at = Infinity;
    const now = performance.now();
    for (const n of _nodes) {
      if (!(now >= n._clkNext)) continue; // also skips clock not yet timed
      const t = n._clkNext;
      n._clkNext += n._clkMs;
      if (now >= n._clkNext) n._clkNext = _slot(now, n._clkMs, n._clkOff); // fell behind - resync, no burst
      try { n.emit(pulse(t)); } catch (e) { debug('clock emit failed', e, true); }
    }
    _arm();
  };

  const retime = (node, ms, offbeat) => {
    node._clkMs = ms; node._clkOff = offbeat ? ms / 2 : 0;
    node._clkNext = _slot(performance.now(), ms, node._clkOff);
    if (_nodes.has(node)) _arm();
  };
  const register = node => { _nodes.add(node); _arm(); };
  const unregister = node => { _nodes.delete(node); _arm(); };
  return { register, unregister, retime };
})();

// quest client - api per patchbay: ?quest-api, then pb.questApi, then page origin

const quests = (() => {
  const api = el => (new URLSearchParams(location.search).get('quest-api') || patchbayOf(el)?.questApi || location.origin).replace(/\/+$/, ''); // read per call so host can retarget
  const write = (method, url, body) => fetch(url, body === undefined ? { method } : { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); // server honors loopback only

  const shortHash = str => { // stable short channel id from url or name
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
    return Math.abs(h).toString(36).slice(0, 6);
  };

  const parseInputLine = raw => { // [name,] url, target - target last, may hold commas
    const line = raw.trim();
    if (/^https?:\/\//i.test(line)) { // leading url verbatim, rest is target
      const url = (line.match(/^https?:\/\/\S+/i) || [''])[0].replace(/,\s*$/, '');
      if (!url) return null;
      const target = line.slice(line.indexOf(url) + url.length).replace(/^\s*,?\s*/, '').trim();
      const hash = shortHash(url);
      return { name: '', url, target, hash, channel: 'ch_q_' + hash };
    }
    const parts = line.split(',');
    const name = (parts[0] || '').trim();
    const url = (parts[1] || '').trim();
    const target = parts.slice(2).join(',').trim();
    if (!name && !url) return null;
    const hash = shortHash(name || url);
    return { name, url, target, hash, channel: name || 'ch_q_' + hash };
  };

  const POLL_MS = 2000;
  const _lists = new Map(); // api > { list, at, inflight }
  const _fetchList = (base, maxAge = 0) => { // one /quests read per api, concurrent calls join it
    let s = _lists.get(base); if (!s) _lists.set(base, s = {});
    if (maxAge && s.list && Date.now() - s.at < maxAge) return Promise.resolve(s.list);
    return s.inflight ??= fetch(base + '/quests', { cache: 'no-store', signal: AbortSignal.timeout(6000) }).then(r => { // stale or wedged server never freezes poll
      if (!r.ok) throw new Error('fetch failed');
      return r.json();
    }).then(q => {
      if (!Array.isArray(q)) throw new Error('not an array');
      s.list = q; s.at = Date.now();
      return q;
    }).finally(() => { s.inflight = null; });
  };

  const _valueIn = (q, ch) => {
    const entry = q.find(x => x.channel === ch);
    if (!entry || !entry.result) throw new Error('no result');
    const val = entry.result.value;
    if (val === null || val === undefined) {
      if (entry.result.error) { console.warn('[quests]', ch + ':', entry.result.error); throw new Error(entry.result.error); }
      throw new Error('empty');
    }
    return val;
  };

  const fetchValue = (base, ch) => _fetchList(base).then(q => _valueIn(q, ch));

  const waitingMessage = (base, err) => { // server down names host, value not ready is [waiting]
    const down = err && err.name === 'TypeError'; // connection refused, not value missing
    let host = ''; try { host = new URL(base).host; } catch {} // file:// origin parses with empty host
    return down ? (host ? "nothing's answering at " + host : 'no quest api set') : '[waiting]';
  };

  const _watchers = new Set();

const VERSION = document.documentElement.getAttribute('data-scv-runtime') || '';
const LICENSE = '<!DOCTYPE html>  <!-- scavenge.ar - © 2026 octantes.ar - SPDX-License-Identifier: Apache-2.0 -->\n\n';
const NAMES = { quine: 'scavenger quine', view: 'scavenger view', publish: 'scavenger publish' };
const SCRIPTS = { quine: ['scv-canvas', 'scv-studio'], view: ['scv-canvas'], publish: [] };

const escAttr = v => v.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
const startTag = el => '<' + el.localName + [...el.attributes].map(a => ` ${a.name}="${escAttr(a.value)}"`).join('') + '>';
const outer = id => document.getElementById(id)?.outerHTML || '';

const freeze = root => root.querySelectorAll('input, textarea, select').forEach(f => { // live values aren't attributes
  if (f.tagName === 'INPUT') {
    if (f.type === 'checkbox' || f.type === 'radio') f.toggleAttribute('checked', f.checked);
    else if (f.type !== 'file' && f.getAttribute('value') !== f.value) f.setAttribute('value', f.value);
  }
  else if (f.tagName === 'TEXTAREA') { if (f.textContent !== f.value) f.textContent = f.value; }
  else [...f.options].forEach(o => o.toggleAttribute('selected', o.selected));
});

const _defs = () => { // tag > harvest def script
  const m = new Map();
  document.querySelectorAll('script[data-scv-def]').forEach(s => {
    const tags = s.dataset.scvTag ? [s.dataset.scvTag] : [...s.textContent.matchAll(/customElements\.define\(\s*['"]([^'"]+)['"]/g)].map(x => x[1]);
    tags.forEach(t => m.set(t, s));
  });
  return m;
};
const _hashText = s => { let a = 0x811c9dc5, b = 0x01000193; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 16777619); b = Math.imul(b ^ c, 2246822507); } return (a >>> 0) * 4294967296 + (b >>> 0); }; // two fnv-1a lanes, no byte copy
const _normal = new WeakMap(); // def > { len, hash } of normalized markup
const _defPrint = async (tag, defs) => {
  const c = kit.comps.get(tag), key = c ? c.frag : defs.get(tag);
  if (!key) return null;
  if (!_normal.has(key)) {
    const t = document.createElement('template'), m = c ? null : kit.extractShadowMarkup(key.textContent);
    if (c) t.content.append(c.frag.cloneNode(true)); else if (m != null) t.innerHTML = m;
    _normal.set(key, c || m != null ? { len: t.innerHTML.length, hash: _hashText(t.innerHTML) } : null);
  }
  return _normal.get(key);
};
const _asDef = async (n, defs) => {
  if (n.shadowRoot.querySelector(kit.WIRING_SEL)) return false;
  const p = await _defPrint(n.localName, defs), html = p && n.shadowRoot.innerHTML;
  return !!p && html.length === p.len && _hashText(html) === p.hash;
};

const _remote = new Map(); // url > ref, once per session
const internRemote = async roots => { // servers without cors stay remote links
  const imgs = [];
  roots.forEach(r => r.querySelectorAll('img[src]').forEach(i => { if (/^https?:/i.test(i.src)) imgs.push(i); }));
  await Promise.allSettled(imgs.map(async img => {
    const url = img.src;
    if (!_remote.has(url)) _remote.set(url, fetch(url).then(r => r.ok ? r.blob() : null).then(b => b && kit.asset.put(b)).catch(e => { kit.debug('remote image not kept', e, true); return null; }));
    const ref = await _remote.get(url);
    if (ref) { img.dataset.scvSrc = ref; img.setAttribute('src', kit.asset.url(ref)); }
  }));
};

const _item = async (el, defs, used) => { // component shadows only where they differ from def
  if (el.localName === 'scv-logic') { used.nodes.add(el.dataset.type); return startTag(el) + '</scv-logic>'; }
  const roots = [el], shadows = [];
  const walk = async r => {
    for (const n of r.querySelectorAll('*')) {
      if (n.localName.includes('-')) used.tags.add(n.localName);
      if (n.localName === 'scv-logic') { used.nodes.add(n.dataset.type); continue; }
      if (!n.shadowRoot) continue;
      freeze(n.shadowRoot); roots.push(n.shadowRoot);
      if (await _asDef(n, defs)) continue; // def rebuilds it
      shadows.push(n.shadowRoot); await walk(n.shadowRoot);
    }
  };
  freeze(el); await walk(el);
  await internRemote(roots);
  const html = (startTag(el) + el.getHTML({ shadowRoots: shadows }) + `</${el.localName}>`)
    .replace(/<[a-z][^<>]*>/gi, tag => tag.replace(/\s(?:src|href|poster)="blob:[^"]*"/g, '')); // blob url dies with page - boot rebuilds from data-scv-src
  for (const m of html.matchAll(/scv-asset[:-]([0-9a-f]{16,64})/g)) used.refs.add(m[1]);
  return new Blob([html]); // string freed now, not at end of save
};

const extentOf = pb => {
  let w = 0, h = 0;
  for (const el of pb.children) {
    if (el.localName !== 'scv-item') continue;
    const s = parseFloat(el.style.scale) || 1;
    w = Math.max(w, kit.px(el, 'left') + el.offsetWidth * s);
    h = Math.max(h, kit.px(el, 'top') + el.offsetHeight * s);
  }
  return `${Math.ceil(w + 20)} ${Math.ceil(h + 20)}`;
};

const save = async (pb, kind = 'quine') => {
  if (!SCRIPTS[kind]) throw new Error('unknown export ' + kind);
  pb.setAttribute('extent', extentOf(pb));
  const defs = _defs(), used = { tags: new Set(), nodes: new Set(), refs: new Set() };
  const parts = [LICENSE, `<html lang="en" data-scv-runtime="${escAttr(VERSION)}">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>${NAMES[kind]}</title>\n`,
    document.querySelector('link[rel="icon"]')?.outerHTML || '', '\n', outer('scv-runtime-css'), '\n', outer('scv-runtime'), '\n</head>\n<body>\n', startTag(pb), '\n'];
  for (const el of pb.children) if (!el.hasAttribute('data-scv-appended')) parts.push(await _item(el, defs, used), '\n');
  parts.push('</scv-patchbay>\n');
  for (const h of used.refs) parts.push(new Blob([await kit.asset.element(h)])); // referenced assets only
  for (const t of used.tags) { const c = kit.comps.get(t); if (c) parts.push(c.tpl.outerHTML, '\n'); }
  for (const n of used.nodes) { const src = kit.nodeSources.get(n); if (src) parts.push(`<script type="scv/node" data-scv-node>${src.replace(/<\/script/gi, '<\\/script')}<\/script>\n`); }
  parts.push(outer('scv-boot'), '\n');
  new Set([...used.tags].map(t => defs.get(t)).filter(Boolean)).forEach(s => parts.push(new Blob([s.outerHTML]), '\n'));
  SCRIPTS[kind].forEach(id => parts.push(outer(id), '\n'));
  parts.push('</body>\n</html>\n');
  return new Blob(parts, { type: 'text/html' });
};

const download = (blob, name) => {
  const a = document.createElement('a'), d = new Date(), p = n => String(n).padStart(2, '0');
  a.href = URL.createObjectURL(blob);
  a.download = `${name.replace(/\s+/g, '-')}-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}.html`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 100);
};

PB.use(pb => {
  if (!pb.questApi) pb.questApi = LOCAL_QUESTS;
  pb.save = kind => save(pb, kind);
  pb.export = async (kind = 'quine') => download(await save(pb, kind), NAMES[kind]);
  pb.setMode = m => { pb.mode = m; };
});
})();
</script>
</body>
</html>
