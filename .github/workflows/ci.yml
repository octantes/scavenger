# the suite is the build - every push and PR to main runs all tiers, one aggregated exit code
name: suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a newer push to the same ref cancels the older run - no wasted minutes on stale commits
concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node >= 21 for the built-in global WebSocket the quest engine talks CDP over
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # browser tiers find Chromium via CHROME_PATH. use the runner's pre-installed google-chrome (a real binary) - Ubuntu's apt chromium is a snap whose confinement can't read /tmp, silently breaking the save/reopen tiers
      - name: locate chrome
        run: echo "CHROME_PATH=$(command -v google-chrome || command -v google-chrome-stable)" >> "$GITHUB_ENV"

      # zero dependencies - nothing to install. the suite runs straight off node stdlib
      - name: run the suite
        run: node test/all.mjs

  # bookmarklet.js is a generated artifact (kernel.js, comment-stripped + uri-encoded) - build.mjs already
  # self-heals it locally and fails the suite if it was stale, but that fix never leaves the runner. this
  # job actually commits the fresh copy back to main, same shape as octantes.ar's build-md.yml.
  sync-bookmarklet:
    needs: test
    if: always() && github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: rebuild bookmarklet.js from kernel.js
        run: node test/rebuild-kernel.mjs

      - name: commit & push if it drifted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookmarklet.js
          if git diff --cached --quiet; then
            echo "bookmarklet.js already in sync"
          else
            git commit -m "build: refresh bookmarklet.js from kernel.js"
            git push origin HEAD:main
          fi
