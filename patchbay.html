<!DOCTYPE html>  <!-- scavenge.ar - © 2026 octantes.ar - SPDX-License-Identifier: Apache-2.0 -->

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>patchbay</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="%23986c98"/></svg>'>
<style>
:root { /* matches kernel and quest theme - enforced by token tests */

  --font-mono: 'SF Mono', 'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace;

  --output:            #986C98;
  --input:             #8AB6BB;
  --danger:            #985954;
  --success:           #6FAC67;

  --background-sunk:   #1A1C1C;
  --background-raised: #252727;

  --background-grid:   rgba(255,255,255,0.06);

  --text-danger:       #FFFFFF;
  --text-base:         #AAABAC;
  --text-dim:          #888888;
  --text-faint:        #666666;

  --border:            #3A3C3C;

  --corner-low:        5px;
  --corner-high:       8px;

  --ease-out:          cubic-bezier(.25,.46,.45,.94);
  --ease-swift:        cubic-bezier(.25,.75,.45,1.0);

  --duration-fast:     .15s;
  --duration-base:     .20s;
  --duration-slow:     .35s;

  --fs-a:              12px;
  --fs-b:              13px;
  --fs-c:              14px;
  --fs-d:              16px;

  --cable:             var(--output);
  --action:            var(--text-faint);
  --variable:          var(--output);

  --selection:         rgba(138, 182, 187, 0.15);
  --dim:               color-mix(in srgb, var(--output) 50%, var(--background-sunk)); /* opaque, prevents cable show through */

}

* { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { display: none; }
.hidden { display: none !important; }

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: var(--background-sunk); color: var(--text-base);
  font-family: var(--font-mono); font-size: var(--fs-b);
}

/* ─── right-click menu ─── */
.cmenu { position: fixed; display: flex; flex-direction: column; z-index: 10000; min-width: 140px; }
.ctx-item {
  font-family: inherit; background: var(--background-raised); border: none; color: var(--text-base); text-align: left; padding: 6px 8px; font-size: var(--fs-a); cursor: pointer;
  &:hover { color: var(--output); }
  &.ctx-mode { color: var(--output); &:hover { color: var(--input); } }
  &.ctx-save { color: var(--input); &:hover { color: var(--output); } }
}

/* ─── canvas ─── */
#canvas-container { position: absolute; inset: 0; overflow-x: auto; overflow-y: auto; scroll-behavior: auto; user-select: none; }
#zoom-layer { transform-origin: 0 0; }
#canvas-container::before { /* dot-grid: fixed escapes scroll box for panning consistency */
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(circle, var(--background-grid) var(--background-grid-r, 1px), transparent var(--background-grid-r, 1px));
  background-size: var(--grid-size, 24px) var(--grid-size, 24px);
  background-position: var(--grid-pos, 0px 0px);
  opacity: 0; transition: opacity var(--duration-slow) var(--ease-out);
}
#canvas-container.mode-edit::before { opacity: 1; }
#canvas-container::after { /* vignette: fixed escapes scroll box for panning consistency */
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 300;
  background: radial-gradient(130% 130% at 50% 42%, transparent 62%, rgba(0,0,0,0.22) 100%);
  opacity: 0; transition: opacity var(--duration-slow) var(--ease-out);
}
#canvas-container.mode-edit::after { opacity: 1; }

/* ─── logic nodes ─── */
scv-logic { position: absolute; display: flex; align-items: center; width: 32px; height: 32px; border-radius: 16px; z-index: 100; }
#canvas-container:not(.mode-edit) scv-logic { display: none !important; }
scv-logic.open { width: auto; min-width: 120px; max-width: var(--node-open-width, 300px); background: var(--background-sunk); }

.scv-logic-icon {
  width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-weight: bold; cursor: pointer; user-select: none; border-radius: 50%; position: relative;
  transition: border-radius var(--duration-base), background var(--duration-base), color var(--duration-base), opacity var(--duration-base);
}
scv-logic:not(.open) .scv-logic-icon::after { content: ''; position: absolute; inset: -7px; border-radius: 50%; } /* enlarged hit-target */
scv-logic.open .scv-logic-icon { border-radius: 16px 0 0 16px; }

.scv-logic-input {
  flex: 1; min-width: 0; height: 100%; border: none; background: transparent;
  font-family: inherit; font-size: var(--fs-a); font-weight: bold; outline: none; opacity: 0;
  padding: 0; text-align: center; color: var(--text-base); pointer-events: none; transition: opacity var(--duration-base);
}
scv-logic.open .scv-logic-input { opacity: 1; padding: 0 8px; pointer-events: auto; }
.scv-logic-input::-webkit-inner-spin-button, .scv-logic-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.scv-logic-input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.scv-logic-caret { position: absolute; right: -14px; font-size: var(--fs-c); font-weight: bold; color: var(--text-base); opacity: 0.5; pointer-events: none; transition: opacity var(--duration-base); }
scv-logic.open .scv-logic-caret { opacity: 0; }

.scv-logic-float {
  position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
  font-size: 9px; color: var(--text-dim); white-space: nowrap; pointer-events: none;
  line-height: 1; opacity: 0; transition: opacity 0.3s ease; z-index: 5;
}

/* source nodes: clock (time, the only red) + quest (world, the only green) */
scv-logic[data-type="clock"] .scv-logic-icon { background: var(--danger); color: var(--background-sunk); }
scv-logic[data-type="clock"] .scv-logic-input { color: var(--danger); }
scv-logic[data-type="quest"] .scv-logic-icon { background: var(--success); color: var(--background-sunk); }
scv-logic[data-type="quest"] .scv-logic-input { color: var(--success); }
scv-logic[data-type="quest"].open { width: 450px; }
/* memory nodes: holds state and re-emits it (pink) */
scv-logic[data-type="accumulator"] .scv-logic-icon { background: var(--output); color: var(--background-sunk); }
scv-logic[data-type="accumulator"] .scv-logic-input { color: var(--output); }
scv-logic[data-type="variable"] .scv-logic-icon { background: var(--variable); color: var(--background-sunk); }
scv-logic[data-type="variable"] .scv-logic-input { color: var(--variable); }
/* logic nodes: transforms values in flight (blue); a closed gate reads grey until opened */
scv-logic[data-type="gate"] .scv-logic-icon { background: var(--border); color: var(--text-base); }
scv-logic[data-type="gate"].active .scv-logic-icon { background: var(--input); color: var(--background-sunk); }
scv-logic[data-type="gate"].active .scv-logic-input { color: var(--input); }
scv-logic[data-type="comparator"] .scv-logic-icon { background: var(--input); color: var(--background-sunk); }
scv-logic[data-type="comparator"] .scv-logic-input { color: var(--input); }
scv-logic[data-type="mutator"] .scv-logic-icon { background: var(--input); color: var(--background-sunk); }
scv-logic[data-type="mutator"] .scv-logic-input { color: var(--input); }
/* endpoint nodes: signal leaves graph (grey) - to your eye (reader), to page (action) */
scv-logic[data-type="reader"] .scv-logic-icon { background: var(--text-faint); color: var(--background-sunk); }
scv-logic[data-type="reader"] .scv-logic-input { color: var(--text-dim); }
scv-logic[data-type="action"] .scv-logic-icon { background: var(--action); color: var(--background-sunk); }
scv-logic[data-type="action"] .scv-logic-input { color: var(--text-dim); background: var(--background-raised); border-radius: 0 16px 16px 0; }
scv-logic[data-type="action"].open { width: auto; min-width: 120px; }

.scv-logic-drag {
  display: none; position: absolute; bottom: -9px; left: -9px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--background-sunk); color: var(--input); border: none;
  cursor: grab; z-index: 40; transition: background var(--duration-fast), color var(--duration-fast);
  align-items: center; justify-content: center;
  font-size: var(--fs-b); line-height: 1; touch-action: none;
  &::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; } /* corner hitbox */
  &:hover { background: var(--output); color: var(--background-sunk); }
}
.scv-logic-del {
  display: none; position: absolute; width: 18px; height: 18px; border-radius: 50%;
  padding: 0; line-height: 1; border: none; color: var(--input);
  background: var(--background-sunk); font-family: inherit; font-size: 9px; font-weight: bold;
  cursor: pointer; align-items: center; justify-content: center; z-index: 40; transition: background var(--duration-fast), color var(--duration-fast);
  top: -9px; right: -9px;
  &::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; } /* corner hitbox */
  &:hover { background: var(--danger); color: var(--text-danger); }
}
scv-logic:hover .scv-logic-del, scv-logic:hover .scv-logic-drag { display: flex; }

#canvas-container.mode-edit scv-logic { outline: none !important; box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--output); cursor: crosshair !important; }
#canvas-container.mode-edit scv-logic:hover { box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--input) !important; }

/* ─── lasso - selection ─── */
#lasso-box { position: fixed; border: 1px dashed var(--input); background: var(--selection); pointer-events: none; z-index: 9998; display: none; }
#canvas-container.mode-edit .comp-wrapper.selected { box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--input) !important; }
#canvas-container.mode-edit scv-logic.selected { box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--input) !important; }
#canvas-container.mode-edit scv-logic.wire-danger,
#canvas-container.mode-edit .comp-wrapper.wire-danger { box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--danger) !important; }
#canvas-container.mode-edit scv-logic.dimmed { box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--dim) !important; }
scv-logic.dimmed .scv-logic-icon, scv-logic.dimmed .scv-logic-input, scv-logic.dimmed .scv-logic-caret, .comp-wrapper.dimmed { opacity: 0.5; }

/* ─── components ─── */
.comp-wrapper { position: absolute; transform-origin: top left; --c-t: 0px; --c-r: 0px; --c-b: 0px; --c-l: 0px; transition: opacity var(--duration-slow) ease, box-shadow var(--duration-base); }
.comp-wrapper.hydrating { opacity: 0; } /* hidden until shadow hydrates - else pre-hydration frame flashes empty box */
.comp-wrapper > [data-scv-id]:not(scv-logic) { display: block; min-height: 10px; transition: opacity var(--duration-base); }
scv-logic { transition: opacity var(--duration-slow) ease, box-shadow var(--duration-base); } /* no width, cables measure mid-flight to prevent lagging */
#canvas-container.mode-edit .comp-wrapper::after { content: ''; position: absolute; inset: var(--c-t) var(--c-r) var(--c-b) var(--c-l); pointer-events: none; }
.comp-handles { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; min-width: 40px; min-height: 40px; pointer-events: none; z-index: 2147483647; }
.comp-handles > * { pointer-events: auto; }
.comp-rail {
  /* buttons center one grid cell (24px) left of component's edge, so grid-snapped component's rail lands on dot column */
  display: none; position: absolute; top: 50%; left: -33px; transform: translateY(-50%);
  flex-direction: column; gap: 6px; z-index: 40; align-items: center;
  & > * {
    position: relative; width: 18px; height: 18px; border-radius: 50%;
    border: none; padding: 0; line-height: 1; cursor: pointer;
    background: var(--background-sunk); color: var(--input);
    display: flex; align-items: center; justify-content: center; touch-action: none;
    &::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; } /* hitbox */
  }
  & > * svg { width: 12px; height: 12px; display: block; }
  .comp-drag-handle { cursor: grab; &:hover { background: var(--output); color: var(--background-sunk); } }
  .comp-drag-handle svg { width: 10.2px; height: 10.2px; }
  .comp-z-up:hover, .comp-z-down:hover { background: var(--input); color: var(--background-sunk); }
  .comp-z-up svg { transform: translateY(-1px); }
}
#canvas-container.mode-edit .comp-rail { display: flex; }

.comp-del {
  display: none; position: absolute; top: -9px; right: -9px;
  width: 18px; height: 18px; border-radius: 50%;
  padding: 0; line-height: 1; border: none; color: var(--input);
  background: var(--background-sunk);
  cursor: pointer; align-items: center; justify-content: center; z-index: 40; transition: background var(--duration-fast), color var(--duration-fast);
  &::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; } /* hitbox */
  &:hover { background: var(--danger); color: var(--text-danger); }
  & > svg { width: 10.2px; height: 10.2px; display: block; }
}
#canvas-container.mode-edit .comp-del { display: flex; }

.comp-scale-handle {
  display: none; position: absolute; bottom: -9px; right: -9px;
  width: 18px; height: 18px; background: var(--input); border-radius: 50%; cursor: nwse-resize; z-index: 40; border: none;
  color: var(--background-sunk); align-items: center; justify-content: center; transition: background var(--duration-fast);
  touch-action: none;
  &::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; } /* hitbox */
  &:hover { background: color-mix(in srgb, var(--input), #000 20%); }
  & > svg { width: 10.2px; height: 10.2px; display: block; }
}
#canvas-container.mode-edit .comp-scale-handle { display: flex; }

.comp-drag-edge { display: none; position: absolute; z-index: 2147483646; touch-action: none; } /* one zidx below .comp-handles */
#canvas-container.mode-edit .comp-drag-edge.t { top: var(--c-t); left: var(--c-l); right: var(--c-r); height: 10px; cursor: ns-resize; }
#canvas-container.mode-edit .comp-drag-edge.b { bottom: var(--c-b); left: var(--c-l); right: var(--c-r); height: 10px; cursor: ns-resize; }
#canvas-container.mode-edit .comp-drag-edge.l { top: var(--c-t); bottom: var(--c-b); left: var(--c-l); width: 10px; cursor: ew-resize; }
#canvas-container.mode-edit .comp-drag-edge.r { top: var(--c-t); bottom: var(--c-b); right: var(--c-r); width: 10px; cursor: ew-resize; }
#canvas-container.mode-edit .comp-drag-edge   { display: block; }
#drag-overlay { position: fixed; inset: 0; z-index: 9999; display: none; }

/* ─── link card (pasted url) ─── */
.scv-link-card { display: flex; gap: 10px; width: 312px; min-height: 96px; padding: 8px; box-sizing: border-box; background: var(--background-sunk); border: 1px solid var(--border); border-radius: var(--corner-low); color: var(--text-base); }
.scv-link-card .scv-lc-thumb { width: 78px; height: 78px; flex: none; object-fit: cover; border-radius: var(--corner-low); background: var(--background-raised); }
.scv-link-card .scv-lc-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.scv-link-card .scv-lc-title { font-weight: bold; font-size: var(--fs-b); color: var(--text-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scv-link-card .scv-lc-desc { font-size: var(--fs-a); color: var(--text-dim); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.scv-link-card .scv-lc-open { font-size: var(--fs-a); color: var(--input); text-decoration: none; margin-top: auto; align-self: flex-start; }
.scv-link-card .scv-lc-open:hover { text-decoration: underline; }

/* ─── cables ─── */
#wire-canvas { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; z-index: 101; }
#temp-wire-canvas { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; z-index: 99; }
.mode-edit #wire-canvas { pointer-events: auto; }
.mode-edit #wire-canvas > :not(.cable-group) { pointer-events: none; }
.mode-edit .cable-group { pointer-events: none; }
.cable-path { fill: none; stroke: var(--cs, var(--cable)); stroke-width: 3px; stroke-linecap: round; opacity: 1; transition: stroke var(--duration-base), stroke-width var(--duration-base), opacity var(--duration-slow) ease; will-change: d; }
.mode-edit .cable-path { pointer-events: visibleStroke; cursor: pointer; }
.mode-edit .cable-path:hover { stroke: var(--danger) !important; opacity: 1 !important; }
.cable-temp { stroke-dasharray: 6 6; stroke: var(--input); opacity: 0.8; animation: dash-fwd 0.5s linear infinite; pointer-events: none !important; }
.cable-temp-reverse { animation-name: dash-rev; }
@keyframes dash-fwd { to { stroke-dashoffset: -12; } }
@keyframes dash-rev { to { stroke-dashoffset: 12; } }
@keyframes cable-pulse-anim { 0% { stroke: var(--input); } 100% { stroke: var(--cs, var(--cable)); } } /* --cs preserves per-cable state */
.cable-pulse { animation: cable-pulse-anim 0.4s ease-out; }
@keyframes node-pulse-anim { 0% { box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--input); } 100% { box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--output); } }
#canvas-container.mode-edit scv-logic.node-pulse { animation: node-pulse-anim 0.4s ease-out; }
#canvas-container.mode-edit scv-logic.scv-node-error { box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--danger) !important; }

/* ─── motion ─── */
@keyframes node-reveal { 0% { opacity: 0; box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--input); } 100% { opacity: 1; box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--output); } }
scv-logic { animation: node-reveal 0.3s ease-out backwards; animation-iteration-count: 1; } /* fill backwards, using both would leak permanent accent ring to every node in use mode */

.cable-path.cable-draw-in { /* separate class to prevent re-fire every render cycle */
  stroke-dasharray: var(--cable-length, 0) var(--cable-length, 0);
  stroke-dashoffset: var(--cable-length, 0);
  animation: cable-draw var(--duration-slow) var(--ease-out) forwards;
}
@keyframes cable-draw { to { stroke-dashoffset: 0; } }
#canvas-container.mode-edit scv-logic { transition: box-shadow var(--duration-base) var(--ease-swift), opacity var(--duration-slow) ease; }
#canvas-container.mode-edit scv-logic:hover { box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--input), 0 0 12px color-mix(in srgb, var(--input) 40%, transparent) !important; }
#canvas-container.mode-edit .cable-path { transition: stroke var(--duration-base) var(--ease-swift), stroke-width var(--duration-base) var(--ease-swift), opacity var(--duration-slow) ease; }
#canvas-container.mode-edit .cable-path:hover { stroke-width: 4px !important; }
.comp-rail > *, .comp-del, .ctx-item, .comp-scale-handle { transition: background var(--duration-fast) var(--ease-swift), color var(--duration-fast) var(--ease-swift), transform var(--duration-fast) var(--ease-swift); }
.comp-rail > *:active, .comp-del:active, .comp-scale-handle:active { transform: scale(0.92); }

/* ─── cursor ─── */
#canvas-container.mode-edit scv-logic { cursor: grab; }
#canvas-container.mode-edit scv-logic.dragging { cursor: grabbing; }
#canvas-container.mode-edit .comp-wrapper.dragging { box-shadow: 0 0 28px rgba(0,0,0,0.5) !important; transition: box-shadow var(--duration-base) var(--ease-out); }
#canvas-container.mode-edit scv-logic.dragging { box-shadow: 0 0 0 2px var(--background-sunk), 0 0 0 4px var(--input), 0 0 24px rgba(0,0,0,0.55) !important; }
#wiring-tooltip { display: none; position: fixed; background: var(--output); color: var(--background-sunk); padding: 2px 6px; font-size: 10px; font-weight: bold; pointer-events: none; z-index: 600; border-radius: var(--corner-low); text-transform: uppercase; }

/* ─── menu ─── */
#intro-backdrop {
  position: fixed; inset: 0; z-index: 400; pointer-events: none; opacity: 0;
  background: transparent; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: opacity var(--duration-base) var(--ease-out);
  &.on { opacity: 1; pointer-events: auto; }
}
#intro-menu {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 401; background: var(--background-sunk); border-radius: var(--corner-high); padding: 18px 24px;
  color: var(--text-dim); font-family: var(--font-mono);
  pointer-events: none; opacity: 0; transition: opacity var(--duration-slow) var(--ease-out);
  &.on { opacity: 1; }
}
#intro-menu h1 { margin: 0 0 10px; font-weight: normal; font-size: var(--fs-d); letter-spacing: 1px; text-align: center; color: var(--input); }
#intro-menu h1 .wm { color: var(--output); }
#intro-menu h4 { margin: 0 0 32px; font-weight: normal; font-size: var(--fs-c); color: var(--text-dim); letter-spacing: .08em; text-align: center; }
#intro-menu .intro-cols { display: flex; gap: 64px; }
#intro-menu dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: var(--fs-b); align-content: start; }
#intro-menu dt { color: var(--input); text-align: right; white-space: nowrap; }
#intro-menu dd { margin: 0; color: var(--text-faint); }
#intro-menu .intro-nodes dt { color: var(--output); }

/* ─── bg picker ─── */
#bg-dot { position: fixed; top: 16px; right: 16px; z-index: 500; display: none; align-items: center; }
#bg-swatch {
  width: 16px; height: 16px; border-radius: 50%; flex: none; padding: 0;
  background: var(--background-sunk); border: 1px solid var(--border); cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-swift), border-color var(--duration-fast) var(--ease-swift);
  &:hover { border-color: var(--input); }
  &:active { transform: scale(0.9); }
}
#bg-hex {
  width: 0; opacity: 0; padding: 0; margin: 0; border: 1px solid transparent;
  height: 22px; box-sizing: border-box; overflow: hidden; pointer-events: none;
  background: var(--background-raised); color: var(--text-base); border-radius: var(--corner-low);
  font-family: var(--font-mono); font-size: var(--fs-a); text-align: center; letter-spacing: .04em;
  text-transform: uppercase; outline: none;
  transition: width var(--duration-base) var(--ease-out), opacity var(--duration-base) var(--ease-out),
              padding var(--duration-base) var(--ease-out), margin var(--duration-base) var(--ease-out),
              border-color var(--duration-base) var(--ease-out);
  &:focus { border-color: var(--input); }
  &.bad { border-color: var(--danger); }
}
#bg-dot.open #bg-hex { width: 84px; opacity: 1; padding: 0 8px; margin-right: 12px; border-color: var(--border); pointer-events: auto; }
</style>
</head>

<body>

  <div id="canvas-container">
    <div id="zoom-layer">
      <!-- temp wire lives below nodes so emitting node's ring occludes wire's origin -->
      <svg id="temp-wire-canvas" viewBox="0 0 1 1"><path id="temp-wire" class="cable-path cable-temp hidden" d="M0 0"></path></svg>
      <svg id="wire-canvas" class="hidden" viewBox="0 0 1 1">
        <g id="static-cables"></g>
      </svg>
    </div>
  </div>

  <div id="drag-overlay"></div>
  <div id="lasso-box"></div>
  <div id="wiring-tooltip"></div>

<script>

const canvasContainer = document.getElementById('canvas-container');
const zoomLayer       = document.getElementById('zoom-layer');
const dragOverlay     = document.getElementById('drag-overlay');
const wireCanvas      = document.getElementById('wire-canvas');
const staticCablesGrp = document.getElementById('static-cables');
const tempWire        = document.getElementById('temp-wire');
const tooltip         = document.getElementById('wiring-tooltip');

function placeTooltip(el, x, y) { // position a floating label near cursor, opening toward screen center
  const pad = 15, w = el.offsetWidth, h = el.offsetHeight, vw = innerWidth, vh = innerHeight;
  const left = x > vw / 2 ? x - pad - w : x + pad;
  const top  = y > vh / 2 ? y - h - 2 : y + pad;
  el.style.left = Math.max(2, Math.min(left, vw - w - 2)) + 'px';
  el.style.top  = Math.max(2, Math.min(top, vh - h - 2)) + 'px';
}

const ATTR_EMITS            = 'data-scv-emits';
const ATTR_RECEIVES         = 'data-scv-receives';
const ATTR_ACTION           = 'data-scv-action';
const WIRING_ATTR_SELECTORS = [ATTR_EMITS, ATTR_RECEIVES, ATTR_ACTION];
const VALID_WIRING_TAGS     = ['SCV-LOGIC', 'DIV', 'A', 'SPAN', 'P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
                               'IMG', 'BUTTON', 'INPUT', 'TEXTAREA', 'SELECT', 'LABEL', 'LI', 'TD', 'TH', 'VIDEO', 'CANVAS', 'svg'];

const stop  = e => { e.preventDefault(); e.stopPropagation(); }; // preventDefault + stopPropagation together
const splitWords = s => (s || '').split(' ').filter(Boolean); // split space-separated attribute into non-empty tokens
const uid = (len = 8) => Math.random().toString(36).slice(2, 2 + len); // generate a random id of given length
const px = (el, prop) => parseFloat(el.style[prop]) || 0; // read a numeric style property from an element

const DRAG_THRESHOLD              = 5.0;  // minimum pixel movement before mousedown becomes a drag (prevents accidental grabs)
const CANVAS_SCROLL_EXPAND_AMOUNT = 500;  // extra px padding appended to zoom layer min dimensions so scrolling never hits hard edge
const BEZIER_OFFSET_FACTOR        = 0.50; // target handle length as fraction of edge distance - lower: tighter loops - higher: wider arcs
const BEZIER_MIN_OFFSET           = 50.0; // floor on target handle length - ensures cables still curve when nodes are close
const BEZIER_SOURCE_RATIO         = 0.25; // source handle fraction - lower: curvier turn-out - higher: straighter
const NODE_RING                   = 4.00; // scv-logic box-shadow outline spread (edit mode) - cables anchor to its outer edge

// RUNTIME --------------------------------------------------------------------------- EMBEDDED FACTORIES - SERIALIZED INTO EVERY EXPORT

// factories below are 5/6 published artifact - exportPublish() embeds them verbatim via Function.prototype.toString()
// a published dashboard runs this exact code - editor is just these same factories with more capabilities granted
// changes to routing, data-scv-action vocabulary, scv-logic behaviour, or factories land here and propagate (readme)

// LAW (one-way): STUDIO may call RUNTIME; RUNTIME never references STUDIO - factories below don't touch editor globals
// editor concerns arrive through opts/deps parameters - keeps .toString() embedding self-contained, same runtime

function calcInputWidth(val) { // compute a node input's width (~8px/char + 20px padding), clamped 70-240px
  return Math.min(240, Math.max(70, String(val).length * 8 + 20));
}

function createScavRouter({ // factory: returns routeSend(channel, value) - entry point for injecting values into channels
  shouldRoute    = () => true,
  onRoute        = () => {},
  onAfterDelete  = () => {},
  preventDefault = false
} = {}) {

  let _chDepth         = 0;    // counter: prevents infinite loops stopping execution at 20 cycles
  let _wiredCache      = null; // cache: remembers what elements listen to what channels - performance optimization

  const COMPOUND_VERBS = ['prop', 'method', 'event']; // parameterized data-scv-action verbs, handled by _applyVerb - everything else is a bare/macro verb, handled by _applyMacroVerb

  const invalidateCache = () => { _wiredCache = null; };

  const _wireObserver = window.MutationObserver ? new MutationObserver(invalidateCache) : null;
  const _observedRoots = window.WeakSet ? new WeakSet() : null;

  const _observeRoot = root => { // lazy observe lets external tools invalidate cache - scoped to wiring attrs, no self trigger
    if (!_wireObserver || !root || _observedRoots?.has(root)) return;
    _observedRoots?.add(root);
    _wireObserver.observe(root, { subtree: true, attributes: true, attributeFilter: ['data-scv-emits', 'data-scv-receives', 'data-scv-action'] });
  };

  _observeRoot(document.documentElement); // shadow roots get observed lazily during _rebuildCache

  const _applyVerb = (node, verb, arg, value) => { // executes compound verb (prop/method/event:<arg>) on node
    try {
      if (!arg) return;
      if (verb === 'prop') { // custom css props via setProperty, standard props via brackets mutate html directly
        const propValue = value !== undefined ? value : ''; // using ?? would erase mutators that emit null, '' fallback is prop-only
        if (!arg.startsWith('style.')) return node[arg] = propValue;
        const property = arg.slice(6);
        property.startsWith('--') ? node.style.setProperty(property, propValue) : node.style[property] = propValue;
      }
      else if (verb === 'method' && typeof node[arg] === 'function') node[arg](value);
      else if (verb === 'event') node.dispatchEvent(new CustomEvent(arg, { detail: value, bubbles: true, cancelable: true, composed: true })); // must cross shadow boundary - node commonly lives inside a component's shadow root
    } catch (err) { console.warn(err); }
  };

  const _hide = node => { // hides node, preserving original display for _show restore
    if (!node.dataset.scvOrigDisplay) node.dataset.scvOrigDisplay = window.getComputedStyle(node).display;
    node.style.display = 'none';
  };

  const _show = (node, def) => { // restores node display to original value or fallback
    node.style.display = node.dataset.scvOrigDisplay || def;
  };

  const _toggle = (node, def) => { // flips node between hidden and visible, also preserves original display
    const display = window.getComputedStyle(node).display;
    if (display !== 'none' && !node.dataset.scvOrigDisplay) node.dataset.scvOrigDisplay = display;
    node.style.display = display !== 'none' ? 'none' : (node.dataset.scvOrigDisplay || def);
  };

  const _applyMacroVerb = (node, type, value) => { // executes dom verbs from action logic nodes
    const isLogic = node.tagName === 'SCV-LOGIC';
    switch (type) {
      case 'clone': { // clone whole wired unit to an independent component
        const unit  = node.closest?.('.comp-wrapper') || node; // closest() can't cross shadow boundary, fallback clones in place
        const clone = unit.cloneNode(true);
        const attrs = ['data-scv-emits', 'data-scv-receives', 'data-scv-action'];

        const strip = n => attrs.forEach(a => n.removeAttribute(a));
        strip(clone);

        [clone.shadowRoot, clone].forEach(scope => { // remove wiring attributes from clone
          scope?.querySelectorAll(attrs.map(a => `[${a}]`).join(',')).forEach(strip);
        });

        // fresh id, same as an imported clone - a second copy sharing original's data-scv-id would collide on selection/save
        const cloneHost = clone.matches?.('[data-scv-id]') ? clone : clone.querySelector?.('[data-scv-id]:not(scv-logic)');
        if (cloneHost) cloneHost.dataset.scvId = 'imp_' + uid(9);
        clone.querySelectorAll?.('scv-logic[data-scv-id]').forEach(n => { n.dataset.scvId = 'imp_' + uid(9); });

        if (clone.classList?.contains('comp-wrapper')) { // offset cloned wrapper
          clone.style.left = `${px(clone, 'left') + 24}px`;
          clone.style.top = `${px(clone, 'top') + 24}px`;
        }
        unit.after(clone);
        observeHostGeometry(clone);
        return clone;
      }

      case 'delete': { // deleting a node inside a component wrapper must take wrapper too, not orphan it
        const wrap = node.closest?.('.comp-wrapper');
        const victim = wrap || node;
        try {
          const obs = typeof _hostResizeObserver !== 'undefined' ? _hostResizeObserver : null;
          const target = victim.matches?.('[data-scv-id]') ? victim : victim.querySelector?.('[data-scv-id]');
          if (obs && target) obs.unobserve(target);
        } catch {}
        victim.remove();
        invalidateCache(); // drops cache to prevent keeping deleted node references
        return onAfterDelete(victim);
      }
      case 'toggle': return _toggle(node, isLogic ? 'flex' : 'block');
      case 'hide':   return _hide(node);
      case 'show':   return _show(node, isLogic ? 'flex' : 'block');
      case 'increment':
      case 'decrement': {
        if (isLogic) return node.dispatchEvent(new CustomEvent('scv-logic-calc', { detail: type }));
        const isFormEl = ['INPUT', 'TEXTAREA', 'SELECT'].includes(node.tagName); // matches _toNode's own value-vs-textContent rule
        const v = (Number(isFormEl ? node.value : node.textContent) || 0) + (type === 'increment' ? 1 : -1);

        isFormEl ? (node.value = v) : (node.textContent = v);
        node.dispatchEvent(new Event('input', { bubbles: true, composed: true })); // node may live inside a component's shadow root
        return node.dispatchEvent(new CustomEvent('scv-receive', { detail: v, bubbles: true, composed: true }));
      }
    }
  };

  const _runAction = (node, actAttr, channel, value, isRecv) => { // parses action attribute and applies verb if channel matches
    splitWords(actAttr).forEach(token => { // one node can carry several space-separated verb:channel directives (e.g. a pasted sub-graph)
      const [verb, arg1, arg2] = token.split(':'); // arg1 is compound verb's mandatory arg or macro verb's channel; arg2 is compound verb's optional channel
      const isCompound = COMPOUND_VERBS.includes(verb);
      const explicitCh = isCompound ? arg2 : arg1;
      if (explicitCh === channel || (isRecv && !explicitCh)) {
        isCompound ? _applyVerb(node, verb, arg1 || '', value) : _applyMacroVerb(node, verb, value);
      }
    });
  };

  const _rebuildCache = () => { // walks light dom + nested shadow roots to find wired receiver/action
    const cache = new Map();

    const walk = root => {
      if (!root?.querySelectorAll) return;

      root.querySelectorAll('[data-scv-receives], [data-scv-action]').forEach(n => {
        // a Set dedups: a node that data-scv-action's a channel it also receives must register once, else routeSend double-fires it
        const chs = new Set(splitWords(n.getAttribute('data-scv-receives')));

        splitWords(n.getAttribute('data-scv-action')).forEach(token => { // each token may carry its own :channel
          const [verb, arg1, arg2] = token.split(':');
          const explicitCh = COMPOUND_VERBS.includes(verb) ? arg2 : arg1;
          if (explicitCh) chs.add(explicitCh);
        });

        chs.forEach(ch => { if (!cache.has(ch)) cache.set(ch, []); cache.get(ch).push(n); });
      });

      root.querySelectorAll('*').forEach(n => { // cross shadow boundary and recurse into nested shadow
        if (n.shadowRoot) { _observeRoot(n.shadowRoot); walk(n.shadowRoot); }
      });
    };

    walk(document);
    return cache;
  };

  const _toNode = (node, channel, value) => { // delivers routed value to one target node and cascade
    const isLogic = node.tagName === 'SCV-LOGIC';
    const isRecv = splitWords(node.getAttribute('data-scv-receives')).includes(channel);

    if (isRecv) {
      if (isLogic) { node.dispatchEvent(new CustomEvent('scv-receive', { detail: value, bubbles: false })); }
      else {
        const isFormEl = ['INPUT', 'TEXTAREA', 'SELECT'].includes(node.tagName);
        if (isFormEl && ['checkbox', 'radio'].includes(node.type)) { // uses checked for checkbox/radio since value doesn't toggle
          node.checked = [true, 1, '1', 'true', 'on', 'checked'].includes(value);
        } else if (isFormEl) { // select via .value since textContent wipes <option>
          node.value = value;
        } else {
          node.textContent = value;
        }

        node.dispatchEvent(new CustomEvent('scv-receive', { detail: value, bubbles: true, composed: true })); // signals value arrival - node may live inside a component's shadow root

        if (_chDepth < 20) { // emit to output channels except for the one it received value from
          splitWords(node.getAttribute('data-scv-emits')).forEach(ch => { if (ch !== channel) routeSend(ch, value); });
        }
      }
    }

    _runAction(node, node.getAttribute('data-scv-action'), channel, value, isRecv);
  };

  const routeSend = (channel, value) => { // core dispatch - pushes value into channel, delivers to all listeners
    if (_chDepth >= 20) return console.warn('routeSend: depth limit (20) reached, chain terminated');
    _chDepth++;
    try {
      try { onRoute(channel, value); } catch (err) { console.warn('routeSend: onRoute threw', err); } // a throwing onRoute must not abort delivery to receivers
      _wiredCache ??= _rebuildCache(); // rebuild if invalidated
      _wiredCache.get(channel)?.forEach(node => _toNode(node, channel, value)); // fan out in dom order (as rebuildCache walked them) for multiple receivers
    } finally { _chDepth--; }
  };

  const _getEmitSource = e => { // walks composed path to find the element that emits on a channel, if any
    const path = e.composedPath();
    if (path.some(n => (n.tagName === 'SCV-LOGIC' || n.hasAttribute?.('data-scv-emitter')) && n.hasAttribute?.('data-scv-emits'))) return null; // wired logic node or composed component routes own emit(v), never raw internal dom values
    const src = path.find(el => el.hasAttribute?.('data-scv-emits'));
    return src && { src, chs: src.getAttribute('data-scv-emits') };
  };

  const _getSrcNode = e => { // finds the actual form element or contentEditable host that originated event
    const path = e.composedPath();
    return path.find(n => n.nodeType === 1 && (n.value !== undefined || n.isContentEditable)) || path[0];
  };

  const _routeToChannels = (chs, val) => { // shared fan-out tail, identical across three listeners below
    splitWords(chs).forEach(ch => routeSend(ch, val));
  };

  const applyActionToReceivers = (verb, channel, value) => { // applies an action verb to all nodes wired to channel
    _wiredCache ??= _rebuildCache();
    _wiredCache.get(channel)?.forEach(node => {
      const isRecv = splitWords(node.getAttribute('data-scv-receives')).includes(channel);
      const actAttr = node.getAttribute('data-scv-action');
      const already = (verb, actAttr, channel) => splitWords(actAttr).some(tok => { // does node's own action attr already fire this verb?
        const [v, a1, a2] = tok.split(':');
        const ec = COMPOUND_VERBS.includes(v) ? a2 : a1;
        return v === verb && (ec === channel || !ec);
      });

      if (isRecv) { // parse compound verbs, same as _toNode - without this typed verbs silently no-op
        const [t, arg] = verb.split(':');
        if (COMPOUND_VERBS.includes(t)) _applyVerb(node, t, arg || '', value);
        else if (!already(verb, actAttr, channel)) _applyMacroVerb(node, verb, value); // _runAction below covers attr-listed verbs once
      }

      _runAction(node, actAttr, channel, value, isRecv); // fire data-scv-action targets, as in _toNode
    });
  };

  document.addEventListener('click', e => { // clicking a wired element routes its value into its channel
    if (!shouldRoute('click')) return;
    const emit = _getEmitSource(e); if (!emit) return;
    if (preventDefault && !['checkbox', 'radio'].includes(emit.src.type)) { e.preventDefault(); e.stopPropagation(); } // a checked control must still toggle
    const srcNode = _getSrcNode(e); // route deepest control, matching input/keyup listeners - a container wrapper must not deliver its own textContent
    if (srcNode.type === 'radio') return; // change carries which one was picked, and fires for keyboard - routing here would double-emit
    const val = srcNode.type === 'checkbox' ? (srcNode.checked ? 1 : 0) : (srcNode.value !== undefined ? srcNode.value : srcNode.textContent);
    _routeToChannels(emit.chs, val);
  });

  document.addEventListener('input', e => { // typing or pasting into a wired form element routes its value
    if (!shouldRoute('input')) return;
    const emit = _getEmitSource(e); if (!emit) return;
    const srcNode = _getSrcNode(e);
    if (['checkbox', 'radio'].includes(srcNode.type)) return; // click already routed post-toggle 1/0
    _routeToChannels(emit.chs, srcNode.value !== undefined ? srcNode.value : srcNode.textContent); // strict, as in click listener
  });

  document.addEventListener('change', e => { // a committed selection (select) routes final value - click fires before dropdown applies
    if (!shouldRoute('change')) return;
    const emit = _getEmitSource(e); if (!emit) return;
    const srcNode = _getSrcNode(e);
    if (srcNode.type === 'checkbox') return; // click already emitted post-toggle 1/0 - radio instead carries the value that picked it
    _routeToChannels(emit.chs, srcNode.value !== undefined ? srcNode.value : srcNode.textContent);
  });

  document.addEventListener('keyup', e => { // pressing a key on a wired non-form element routes its text content
    if (!shouldRoute('keyup')) return;
    const emit = _getEmitSource(e); if (!emit) return;
    const srcNode = _getSrcNode(e);
    if (['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(srcNode.tagName) || srcNode.isContentEditable) return; // skip anything input/change/click handlers already route - keyboard-activated button fires both click and keyup
    _routeToChannels(emit.chs, srcNode.textContent);
  });

  document.addEventListener('scv-emit', e => { // composed component's emit(v) routes detail into element's channel (own logic, not native value)
    if (!shouldRoute('scv-emit')) return;
    const src = e.composedPath().find(el => el.hasAttribute?.('data-scv-emits')); // own lookup - _getEmitSource deliberately rejects emitters
    if (src) _routeToChannels(src.getAttribute('data-scv-emits'), e.detail);
  });

  return { routeSend, applyActionToReceivers, invalidateCache, _wireObserver };
}

function createScavClock() { // factory: manages an absolute-time clock that ticks registered nodes at their configured interval
  let _timer = null;
  const _nodes = new Set();

  const _slot = (now, ms, off) => Math.ceil((now - off) / ms) * ms + off; // next grid slot at or after now

  const _tick = () => { // absolute grid via node._clkNext keeps period locked with no drift, same-period clocks together
    const now = performance.now();
    for (const node of _nodes) {
      const input = node.querySelector('.scv-logic-input');
      const v = Number(input?.value);
      const ok = Number.isFinite(v) && Math.abs(v) >= 1; // bad interval must not become 1ms emit storm - only finite >=1ms magnitude ticks, else default
      const ms = ok ? Math.round(Math.abs(v)) : 1000;
      const off = ok && v < 0 ? ms / 2 : 0; // negative interval - same period, half beat off grid, so two clocks alternate
      node._clkNext ??= _slot(now, ms, off);
      if (now >= node._clkNext) {
        node._clkNext += ms;
        if (now >= node._clkNext) node._clkNext = _slot(now, ms, off); // resyncs if fell behind, like on minimize
        if (typeof node.emit === 'function') node.emit(1);
      }
    }
  };

  // 1ms is floor, browser clamps to ~4ms or further, but harmless since schedule is absolute
  const start = () => { if (_timer) return; _timer = setInterval(_tick, 1); };
  const stop = () => { if (_timer) { clearInterval(_timer); _timer = null; } };
  const register = node => { node._clkNext = null; _nodes.add(node); if (!_timer) start(); };
  const unregister = node => { _nodes.delete(node); if (_nodes.size === 0) stop(); };

  return { register, unregister, start, stop };
}

function createScavQuestClient({ // factory: client half of quest protocol - parsing, endpoints and fetch retry loop
  questWrite = () => {}
} = {}) {

  const api = () => (window.__QUEST_API__ || window.location.origin).replace(/\/+$/, ''); // trailing slash would double-slash every endpoint below

  const shortHash = str => { // stable short channel id from a url or name string
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
    return Math.abs(h).toString(36).slice(0, 6);
  };

  const parseInputLine = raw => { // input grammar: [name,] url, target - name is optional, target is last and rejoined (may hold commas)
    const line = raw.trim();
    if (/^https?:\/\//i.test(line)) { // url-led line: url may itself contain commas - take leading url verbatim, the rest is the target
      const url = (line.match(/^https?:\/\/\S+/i) || [''])[0].replace(/,\s*$/, '');
      if (!url) return null;
      const target = line.slice(line.indexOf(url) + url.length).replace(/^\s*,?\s*/, '').trim();
      const hash = shortHash(url);
      return { name: '', url, target, hash, channel: 'ch_q_' + hash };
    }
    const parts = line.split(',');
    const name = (parts[0] || '').trim();
    const url = (parts[1] || '').trim();
    const target = parts.slice(2).join(',').trim();
    if (!name && !url) return null;
    const hash = shortHash(name || url);
    return { name, url, target, hash, channel: name || 'ch_q_' + hash };
  };

  const fetchValue = ch => fetch(api() + '/quests', { cache: 'no-store', signal: AbortSignal.timeout(6000) }).then(r => { // no-store - polling read must never serve cached value (live component would freeze on first ref) - timeout so server can't wedge _fetching
    if (!r.ok) throw new Error('fetch failed');
    return r.json();
  }).then(q => {
    if (!Array.isArray(q)) throw new Error('not an array');
    const entry = q.find(x => x.channel === ch);
    if (!entry || !entry.result) throw new Error('no result');
    const val = entry.result.value;
    if (val === null || val === undefined) {
      if (entry.result.error) { console.warn('[quests]', ch + ':', entry.result.error); throw new Error(entry.result.error); }
      throw new Error('empty');
    }
    return val;
  });

  const waitingMessage = err => { // one wording for every quest node - server down names host, value-not-ready is [waiting]
    const down = err && err.name === 'TypeError'; // TypeError means connection refused, distinct from value not ready
    let host = ''; try { host = new URL(api()).host; } catch {} // file:// origin parses with empty host
    return down ? (host ? "nothing's answering at " + host : 'no quest api set') : '[waiting]';
  };

  const pollValue = (ch, onValue, onWaiting) => { // fetches every 2s until value lands - returns cancel which discards in flight result
    let cancelled = false, timer = null;
    const attempt = () => {
      fetchValue(ch).then(v => { if (!cancelled) onValue(v); }).catch(err => {
        if (cancelled) return;
        onWaiting(waitingMessage(err));
        timer = setTimeout(attempt, 2000);
      });
    };
    attempt();
    return () => { cancelled = true; if (timer) { clearTimeout(timer); timer = null; } };
  };

  // server writes: all flow through injected questWrite capability (quests.mjs accepts them from direct loopback only)
  const registerScrape = ({ channel, url, target }) => { // target is raw pipeline the server parses, client doesn't track grammar
    const entry = { channel, url };
    if (target) entry.target = target;
    return questWrite('POST', api() + '/quests', entry);
  };

  const emitValue = (channel, value) => questWrite('POST', api() + '/quests/emit', { channel, value }).catch(() => {}); // fire-and-forget per-value emit swallows its failure
  const releaseChannel = channel => questWrite('DELETE', api() + '/quests/' + encodeURIComponent(channel)).catch(() => {}); // fire-and-forget cleanup swallows its failure

  return { api, shortHash, parseInputLine, fetchValue, pollValue, waitingMessage, registerScrape, emitValue, releaseChannel };
}

function defineScavLogic({ // define scv-logic custom element with each type behavior, granting capabilities through dep params
  onRegister             = () => {},
  onUnregister           = () => {},
  onResize               = () => {},
  clockRegister          = () => {},
  clockUnregister        = () => {},
  routeSend              = () => {},
  applyActionToReceivers = () => {},
  questWrite             = () => {},
} = {}) {

  if (!window.customElements || customElements.get('scv-logic')) return;

  const _scvVars = new Map();  // let variable nodes write named values here that mutators read by injecting names as function params
  const _scvConst = new Set(); // const variable nodes write once until owning node frees it via rename/retype/delete
  const _scvOwners = new Map(); // last publisher per name - a rename/delete must not wipe a name still published by another node

  const GLOBALS = new Set(['Math', 'JSON', 'Object', 'Array', 'Number', 'String', 'Boolean', 'Date', 'RegExp', 'Promise',
    'parseInt', 'parseFloat', 'isNaN', 'isFinite', 'decodeURIComponent', 'encodeURIComponent', 'console', 'window',
    'document', 'globalThis', 'undefined', 'NaN', 'Infinity']); // a variable named Math/parseInt would shadow global inside every mutator expression
  const isValidVarName = n => { // "v" and the curated global list are reserved - anything else must be a valid identifier
    if (!n || n === 'v' || GLOBALS.has(n)) return false;
    try { new Function(n, ''); return true; }
    catch { return false; }
  };

  const quests = createScavQuestClient({ questWrite }); // quest protocol client - questWrite is the only granted write capability

  const _questChannelStillNeeded = (channel, exceptNode) => // guards against severing a quest scrape that other nodes display
    [...document.querySelectorAll('scv-logic')].some(node =>
      node !== exceptNode && node.type === 'quest' && node._questMode === 'input' && node._questChannel === channel);

  customElements.define('scv-logic', class extends HTMLElement { // shape for built-in and custom .scv node types
    constructor() { super(); }

    static nodeTypes = {
      clock:          { icon: '◷︎', val: '1000',   inputType: 'number', setup: (self, icon, input) => self._setupClock(icon, input) },
      accumulator:    { icon: '#', val: '0',      inputType: 'number', setup: (self, icon, input) => self._setupAccumulator(icon, input) },
      variable:       { icon: 'L', val: '',       setup: (self, icon, input) => self._setupVariable(icon, input) },
      gate:           { icon: '✗︎', val: 'gate',   setup: (self, icon, input) => self._setupGate(icon, input) },
      comparator:     { icon: '≠︎', val: '',       setup: (self, icon, input) => self._setupComparator(icon, input) },
      mutator:        { icon: 'ƒ︎', val: 'v',      setup: (self, icon, input) => self._setupMutator(icon, input) },
      reader:         { icon: '⊙︎', val: '',       setup: (self, icon, input) => self._setupReader(icon, input) },
      action:         { icon: '⚡︎', val: 'toggle', setup: (self, icon, input) => self._setupAction(icon, input) },
      quest:          { icon: '⌕︎', val: '',       setup: (self, icon, input) => self._setupQuest(icon, input) },
    };

    connectedCallback() { // first connect: seed dom + run setup once - reconnect re-registers torn down bindings
      if (this.ownerDocument !== document) return; // export publish clones into detached document - registering clone would double emit
      this.type = this.dataset.type;
      const nodeType = this.constructor.nodeTypes[this.type];
      const isReconnect = this._wired; // _wired is set once and never reset to distinguish delete > undo from first connect

      if (!this._wired) { // one-time wiring, never resets to prevent duplicated emits on undo
        if (this.childElementCount === 0) this._buildInnerHTML();
        const icon = this.querySelector('.scv-logic-icon');
        const input = this.querySelector('.scv-logic-input');
        if (!icon || !input) return;
        this._wired = true;

        icon.addEventListener('dblclick', e => e.stopPropagation());
        this.addEventListener('dblclick', e => {
          if (e.target === input) return;
          this.classList.toggle('open');
          if (this.classList.contains('open')) { input.focus(); if (typeof input.select === 'function') input.select(); }
          onResize(this);
        });

        input.addEventListener('input', () => { // resize is instant - re-derive cables right away since layout is synchronous
          input.style.width = calcInputWidth(input.value) + 'px';
          onResize(this);
        });

        input.style.width = calcInputWidth(input.value || ' ') + 'px';
        if (nodeType?.setup && !nodeType.custom) nodeType.setup(this, icon, input); // built-in setup adds persistent listeners, run once
      }

      if (nodeType?.custom && nodeType.setup) { // custom setup is re-entrant - reruns on reconnects so delete > undo keeps working
        nodeType.setup(this, this.querySelector('.scv-logic-icon'), this.querySelector('.scv-logic-input'));
      }

      if (isReconnect) this._reconnect?.(); // quest re-registers scrape, variable re-publishes binding - _wired gate stops setup re-run
      if (this.type === 'clock') clockRegister(this);
      onRegister(this);
    }

    _buildInnerHTML() { // writes standard five element node structure from type's own table entry only on fresh spawns
      const SAFE_TYPES = ['text', 'number', 'checkbox', 'radio', 'email', 'url', 'tel', 'password']; // a def-supplied inputType must not inject attributes
      const { icon, val, inputType } = this.constructor.nodeTypes[this.type] || {};
      const it = SAFE_TYPES.includes(inputType) ? inputType : 'text';
      const ic = String(icon ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      this.innerHTML = `<div class="scv-logic-icon">${ic}</div>` +
      `<input class="scv-logic-input" name="scv-node-value" aria-label="node value" ` +
      `type="${it}" value="${String(val ?? '').replace(/"/g, '&quot;')}" spellcheck="false"><div class="scv-logic-caret">›</div>` +
      `<button class="scv-logic-del">✕</button><div class="scv-logic-drag">+</div>`;
    }

    _setupCustom(icon, input, def) { // sets up a custom .scv node building ctx api, wiring and running init
      const self = this;
      if (self._customCleanup) self._customCleanup(); // re-dropped .scv reruns setup on placed nodes keeping identity and wiring
      self._customReady = true;
      let iconClick = null;
      const entry = this.constructor.nodeTypes[this.type] || {};
      if (entry.color) { icon.style.background = entry.color; icon.style.color = 'var(--background-sunk)'; input.style.color = entry.color; }

      const ctx = { // ctx api handed to custom .scv defs - value r/w with auto resize, emit, feedback, composition, identity and position
        el: self, input, icon,
        get value() { return input.value; },
        set value(v) { input.value = v; input.style.width = calcInputWidth(v) + 'px'; if (self.classList.contains('open')) onResize(self); },
        emit(v) { self.emit(v); },
        showFloat(v) { self._showFloat(v); },
        flashError(label, err) { self._flashError(label, err); },
        append(el, x = 0, y = 0) {
          const target = document.getElementById('zoom-layer') || document.getElementById('canvas-container'); // resolved at call time, ignoring zoomLayer
          if (!target) return null;
          const id = 'append_' + uid(6);
          const wrapper = document.createElement('div');
          wrapper.className = 'comp-wrapper';
          wrapper.dataset.compId = id;
          wrapper.dataset.scvAppended = '1'; // reopened dashboard recreates this via init() so exports skip it to prevent duplication
          wrapper.style.left = x + 'px';
          wrapper.style.top = y + 'px';
          if (typeof COMP_CHROME !== 'undefined') wrapper.innerHTML = COMP_CHROME; // studio-only edit chrome, published correctly gets none
          if (el.nodeType === 1 && el.dataset && !el.dataset.scvId) el.dataset.scvId = id; // studio locates components via [data-scv-id]
          wrapper.prepend(el);
          target.appendChild(wrapper);
          return wrapper;
        },
        get id() { return self.dataset.scvId; },
        get type() { return self.dataset.type; },
        get mode() { return def.modes?.length ? def.modes[self._modeIdx || 0].id : undefined; },
        get x() { return parseInt(self.style.left) || 0; },
        get y() { return parseInt(self.style.top) || 0; },
        setPosition(x, y) { self.style.left = x + 'px'; self.style.top = y + 'px'; },
        remove(el) {
          const wrapper = el.closest('.comp-wrapper');
          const target = wrapper || el;
          try { if (typeof _hostResizeObserver !== 'undefined' && _hostResizeObserver) {
            const host = target.matches?.('[data-scv-id]:not(scv-logic)') ? target : target.querySelector?.('[data-scv-id]:not(scv-logic)');
            if (host) _hostResizeObserver.unobserve(host);
          } } catch {}
          target.remove();
        },
      };

      if (Array.isArray(def.modes) && def.modes.length) { // clicking icon cycles .modes - .onMode fires on change - persisted in data-scv-mode
        const ids = def.modes.map(mode => mode.id);
        self._modeIdx = Math.max(0, ids.indexOf(self.dataset.scvMode));
        const applyMode = fire => {
          const mode = def.modes[self._modeIdx];
          icon.textContent = mode.icon != null ? mode.icon : (entry.icon || def.icon || '◆');
          self._label = mode.label != null ? mode.label : (mode.id || def.label || def.name);
          self.dataset.scvMode = mode.id;
          const color = mode.color || entry.color; // per-mode color, falls back to base color
          if (color) { icon.style.background = color; icon.style.color = 'var(--background-sunk)'; input.style.color = color; }
          if (fire && def.onMode) { try { def.onMode(mode.id, ctx); } catch (err) { self._flashError('onMode', err); } }
        };
        applyMode(false);
        self._applyMode = applyMode; // exposed so undo/redo can re-fire it after restoring, else def side effects stay stuck in pre undo mode
        iconClick = e => {
          e.stopPropagation();
          self._modeIdx = (self._modeIdx + 1) % def.modes.length;
          applyMode(true);
        };
        icon.addEventListener('click', iconClick);
      }

      const onReceive = e => { try { if (def.onReceive) def.onReceive(e.detail, ctx); } catch (err) { self._flashError('onReceive', err); } };
      self.addEventListener('scv-receive', onReceive);
      if (def.teardown) self._customTeardown = () => { try { def.teardown(ctx); } catch {} }; // def listeners or timers released to prevent leaks
      self._customCleanup = () => { // undoes setup in place for later re-init: drop listeners + run teardown, leaving element alive
        self.removeEventListener('scv-receive', onReceive);
        if (iconClick) icon.removeEventListener('click', iconClick);
        if (self._customTeardown) { self._customTeardown(); self._customTeardown = null; }
        self._customCleanup = null;
      };

      if (def.placeholder != null) input.placeholder = def.placeholder;
      if (def.label && !Array.isArray(def.modes)) self._label = def.label;
      if (def.openWidth) { self.style.setProperty('--node-open-width', def.openWidth + 'px'); } else { self.style.removeProperty('--node-open-width'); }
      try { if (def.init) def.init(ctx); } catch (err) { self._flashError('init', err); }
    }

    _setupClock(icon, input) { // ticks at interval shown in input - icon click resets and fires immediately
      this._ensureEmitChannel('clock');
      icon.addEventListener('click', () => { this.emit(1); this._showFloat('⟳'); }); // extra tick now - grid keeps its own schedule
      input.addEventListener('change', () => { this._clkNext = null; }); // clockRegisters per re-connect in connectedCallback
    }

    _setupAccumulator(icon, input) { // running total of received values - icon click resets to 0
      const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; }; // Infinity/NaN must not poison running total
      icon.addEventListener('click', () => { input.value = 0; this._output(0); });
      input.addEventListener('input', () => this._output(input.value));
      this.addEventListener('scv-receive', e => { const val = num(input.value) + num(e.detail); input.value = val; this._output(val); });
      this.addEventListener('scv-logic-calc', e => { const val = num(input.value) + (e.detail === 'increment' ? 1 : -1); input.value = val; this._output(val); });
    }

    _setupVariable(icon, input) { // names received value into store with input name for mutators to read - click cycles let vs const
      this._ensureEmitChannel('var'); // var is emit-on-assignment source - gets a channel independent from wire

      const MODES = ['let', 'const']; // let: any node may reassign name - const: locked to this owner, only it can write
      this._varMode = this._varMode || this.dataset.varMode || 'let'; // persist across reopen + paste
      input.placeholder = 'name';
      const glyph = mode => mode[0].toUpperCase();

      const release = () => { // drops this node's binding - if it owns name's const lock, frees that too
        if (this._varName) {
          if (_scvOwners.get(this._varName) === this) { // a shared let name survives unless this node is its last publisher
            _scvVars.delete(this._varName);
            _scvOwners.delete(this._varName);
          }
          if (this._ownsConst) _scvConst.delete(this._varName);
        }
        this._varName = null;
        this._ownsConst = false;
      };

      const publish = () => { // writes value into store under node's name - returns true only on actual write - callers emit only from real data
        const name = input.value.trim();
        if (!isValidVarName(name)) { // an invalid rename must not drop a live binding - leave old name publishing
          this._varName = null; this._ownsConst = false;
          return false;
        }
        if (this._varName && this._varName !== name) release(); // renamed > drop old binding
        this._varName = name;
        if (this._storedValue === undefined) return false;
        if (_scvConst.has(this._varName) && !this._ownsConst) return false; // const-locked: reject writes from other nodes
        _scvVars.set(this._varName, this._storedValue);
        _scvOwners.set(this._varName, this); // last publisher owns slot - an earlier node's release can't wipe it
        if (this._varMode === 'const') { _scvConst.add(this._varName); this._ownsConst = true; }
        this._showFloat(_scvVars.get(this._varName));
        return true;
      };

      icon.textContent = glyph(this._varMode); this._label = this._varMode; this.dataset.varMode = this._varMode;
      icon.addEventListener('click', e => {
        e.stopPropagation();
        if (this._ownsConst && this._varName) { _scvConst.delete(this._varName); this._ownsConst = false; } // leaving const mode frees lock
        this._varMode = MODES[(MODES.indexOf(this._varMode) + 1) % MODES.length];
        icon.textContent = glyph(this._varMode); this._label = this._varMode; this.dataset.varMode = this._varMode;
        publish();
      });

      // received value updates store and emits - edits below call publish() for its store side effect and ignore result
      this.addEventListener('scv-receive', e => { this._storedValue = e.detail; if (publish()) this.emit(this._storedValue); });
      input.addEventListener('input', publish);
      this._reconnect = publish; // re-publish on delete > undo reconnect: _disconnect dropped _scvVars binding and _setupVariable won't rerun
      this._disconnect = () => { // frees store binding (and any owned const lock) when node leaves dom
        if (this._varName && _scvOwners.get(this._varName) === this) {
          _scvVars.delete(this._varName); _scvOwners.delete(this._varName);
          if (this._ownsConst) _scvConst.delete(this._varName);
        }
      };
    }

    _setupGate(icon, input) { // passes values when active, blocks when inactive - icon or received 1's toggle mode
      icon.textContent = this.classList.contains('active') ? '✓︎' : '✗︎'; // sync glyph to persisted active class for restore
      icon.addEventListener('click', () => { const isActive = this.classList.toggle('active'); icon.textContent = isActive ? '✓\uFE0E' : '✗\uFE0E'; });
      this.addEventListener('scv-receive', e => {
        if (e.detail == 1) { // loose - a string "1" must trigger, matching quest node
          const isActive = this.classList.toggle('active');
          icon.textContent = isActive ? '✓\uFE0E' : '✗\uFE0E';
        } else if (this.classList.contains('active')) {
          input.value = e.detail;
          input.style.width = calcInputWidth(input.value) + 'px';
          this._output(e.detail);
        }
      });
    }

    _setupComparator(icon, input) { // compares successive pairs: 1 if all equal, 0 otherwise - icon inverts comparison
      this._cmpValues = [];
      this._invert = this.dataset.cmpInvert === '1'; // persisted as attribute - seeds a fresh node to real eq state
      if (!this._invert) icon.textContent = '='; // inverted keeps the glyph node was built with
      input.value = this._invert ? 'inequality' : 'equality';
      icon.addEventListener('click', () => {
        this._invert = !this._invert; if (this._invert) this.dataset.cmpInvert = '1'; else delete this.dataset.cmpInvert;
        this._cmpValues = []; // a pending half-pair must not straddle mode flip
        icon.textContent = this._invert ? '≠\uFE0E' : '='; input.value = this._invert ? 'inequality' : 'equality';
      });
      this.addEventListener('scv-receive', e => {
        this._cmpValues.push(e.detail);
        if (this._cmpValues.length >= 2) {
          const eq = this._cmpValues.every(v => v === this._cmpValues[0]);
          this._output(this._invert !== eq ? 1 : 0);
          this._cmpValues = [];
        }
      });
    }

    _setupMutator(icon, input) { // evaluates input expression with received value as v plus all variable names as params
      let _fn = null, _fnKey = null; // compiled expression - only text and param names decide it, values passed in
      const evalExpr = v => { // v = received value - _scvVars name are injected too as named params for use as variables
        const names = [..._scvVars.keys()], vals = names.map(n => _scvVars.get(n));
        const key = names.join(',') + '\0' + input.value;
        if (key !== _fnKey) { _fn = new Function('v', ...names, 'return ' + input.value); _fnKey = key; } // throw leaves key stale, so next value retries compile
        return _fn(v, ...vals);
      };
      icon.addEventListener('click', () => { // _storedValue must start undefined to prevent pre-data click evaluating against itself
        if (this._storedValue !== undefined) {
          try { this._output(evalExpr(this._storedValue)); }
          catch (err) { this._flashError('mutator', err); }
        }
      });
      this.addEventListener('scv-receive', e => {
        this._storedValue = e.detail;
        try { this._output(evalExpr(e.detail)); } catch (err) { this._flashError('mutator', err); }
      });
    }

    _setupReader(icon, input) { // stores last received value, listens on received 1's and icon click re-emits it
      this._ensureEmitChannel('reader');
      const initVal = input.value.trim();
      if (initVal) { // preserve exact string unless it round-trips to a number cleanly ('007'/'1e3'/'0x10' stay strings)
        const n = Number(initVal);
        this._storedValue = String(n) === initVal ? n : initVal;
      }

      const display = v => {
        this._storedValue = v;
        input.value = v;
        input.style.width = calcInputWidth(input.value) + 'px';
        this._showFloat(v);
      };
      const read = () => {
        if (this._storedValue !== undefined) { display(this._storedValue); this.emit(this._storedValue); }
      };

      icon.addEventListener('click', read);
      this.addEventListener('scv-receive', e => {
        if (e.detail == 1) { read(); } // loose - a string "1" must trigger, matching quest node
        else { this._storedValue = e.detail; }
      });
    }

    _setupAction(icon, input) { // cycles dom verbs (toggle/hide/show/delete/clone/increment/decrement) and fires on receive
      this._ensureEmitChannel('action');
      const VERBS = ['toggle','hide','show','delete','clone','increment','decrement'];
      const fire = () => {
        const verb = input.value.trim() || 'toggle';
        const allChs = splitWords(this.getAttribute('data-scv-emits'));
        allChs.forEach(c => applyActionToReceivers(verb, c, verb));
      };
      icon.addEventListener('click', e => {
        e.stopPropagation();
        const cur = input.value.trim();
        const idx = VERBS.indexOf(cur);
        input.value = VERBS[(idx + 1) % VERBS.length];
        this._showFloat(input.value);
      });
      this.addEventListener('scv-receive', () => fire());
    }

    _setupQuest(icon, input) { // input subs to quest channel registering server scrape - output POSTs received value to server
      this._questMode = this._questMode || this.dataset.questMode || 'input'; // mode persists in dom attr for survival without reset

      const MODES = {
        input:     { icon: '⌕︎', ph: 'url, [wait:/click: steps |] sel:/key:/ls:   (optional name, first)' },
        output:    { icon: '↗︎', ph: 'output channel name' },
        component: { icon: '▦', ph: 'url, selector' }, // live component, not value - node becomes component
      };

      const applyMode = () => { // syncs icon, placeholder, label and persists mode in dataset
        icon.textContent = MODES[this._questMode].icon;
        input.placeholder = MODES[this._questMode].ph;
        this._label = 'quest ' + this._questMode;
        this.dataset.questMode = this._questMode; // persist for reopen + paste
      };

      const cleanupWiring = () => { // cancels polling, removes quest channel from emits, unregisters
        this._pollCancel?.(); this._pollCancel = null;
        this._unmountLive?.(); // reconfiguring drops old live component so new channel spawns fresh, not besides stale
        if (this._questChannel) {
          const filtered = (this.getAttribute('data-scv-emits') || '').split(' ').filter(c => c !== this._questChannel);
          if (filtered.length) this.setAttribute('data-scv-emits', filtered.join(' '));
          else this.removeAttribute('data-scv-emits');
          onUnregister(this);
        }
      };

      const _showFetched = val => { // displays a fetched value on node and emits to cables
        this._storedValue = val;
        this._showFloat(val);
        if (!this._emitting) {
          this._emitting = true;
          this.emit(val);
          this._emitting = false;
        }
      };

      const compLine = raw => { // component mode input is url, selector - wrap selector as harvest: extraction, mode implies it
        const ci = raw.indexOf(',');
        return ci < 0 ? raw : raw.slice(0, ci).trim() + ', harvest:' + raw.slice(ci + 1).trim().replace(/^harvest:\s*/i, '');
      };
      const unmountLive = () => { this._liveWrapper?.remove(); this._liveWrapper = null; };
      this._unmountLive = unmountLive;
      const mountFresh = (tag, script) => { // first spawn (or structural remount): full render beside node
        const prev = this._liveWrapper;
        const x = prev ? px(prev, 'left') : px(this, 'left'); // keep place across structural remount; first spawn sits beside node
        const y = prev ? px(prev, 'top') : px(this, 'top') + 40;
        unmountLive();
        const w = renderComponent({ tag, scvId: 'live_' + uid(6), script, shadowHTML: extractShadowMarkup(script), x, y, zIndex: 1 });
        if (!w) return;
        w.dataset.scvQuestChannel = this._questChannel; // boot re-binds + export bakes last state, so it reloads in place and offline
        this._liveWrapper = w;
      };
      const mountLive = html => { // refresh: morph shadow in place (keep wrapper position, scroll and wiring) when layout is stable, full render otherwise
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const compEl = doc.querySelector('[data-scv-component]'), def = doc.querySelector('script[data-scv-def]');
        if (!compEl || !def) return;
        const script = boxScopeCss(def.textContent); // exact shadow live element was built from - morph diffs against it, mountFresh rebuilds from it
        const live = this._liveWrapper?.querySelector('[data-scv-id]');
        if (live?.shadowRoot) { const m = extractShadowMarkup(script); if (m && morphLiveShadow(live, m)) { scheduleRenderCables(); return; } }
        mountFresh(compEl.tagName.toLowerCase(), script);
      };
      this._adoptLive = () => { this._liveWrapper = [...zoomLayer.querySelectorAll('.comp-wrapper')].find(w => w.dataset.scvQuestChannel === this._questChannel) || null; }; // boot: bind to exported component instead of spawning duplicate
      const showComponent = ref => { // path#hash ref - fetch component file and render; dedup on hash so unchanged poll is no-op
        const s = String(ref || '');
        if (!s || s === this._liveRef) return;
        this._liveRef = s;
        const [path, hash] = s.split('#'), name = path.split('/').pop(), boundTo = this._questChannel;
        // file path is stable across versions, so hash rides as query to bust browser cache - else update refetches stale component
        fetch(quests.api() + '/component/' + encodeURIComponent(name) + (hash ? '?' + hash : '')).then(r => r.ok ? r.text() : null)
          .then(html => { if (html && this._questChannel === boundTo) mountLive(html); }).catch(() => {});
      };

      const applyCfg = () => { // parses input, cleans old wiring if reconfiguring, registers scrape and starts polling
        if (!this.isConnected) return; // a late timer (boot/debounce) must not register a scrape on a detached node
        const raw = input.value.trim();
        if (!raw) return;
        const inMode = this._questMode === 'input';
        const compMode = this._questMode === 'component';
        const scrapeMode = inMode || compMode; // both register server scrape and poll channel; output only emits
        let parsed = null, hash, ch;
        if (scrapeMode) {
          parsed = quests.parseInputLine(compMode ? compLine(raw) : raw);
          if (!parsed) return;
          ({ hash, channel: ch } = parsed);
        } else {
          const out = quests.parseInputLine(raw);
          ch = (out && out.channel) || raw.split(',')[0].trim(); // same channel derivation as input mode: name, or ch_q_<hash> for an unnamed line
          hash = quests.shortHash(ch);
        }
        if (this._questChannel) { // clean up old channel wiring before reconfiguring
          if (this._questChannel !== ch && this._hadScrape && !_questChannelStillNeeded(this._questChannel, this)) {
            quests.releaseChannel(this._questChannel);
          }
          cleanupWiring();
        }
        if (!this.dataset.scvId) { // only generate when none exists - a prior id (e.g. ctx.append's append_xxx) must survive for [data-scv-id] lookups
          this.dataset.scvId = 'quest_' + hash + '_' + uid(5);
        }
        if (inMode) { // set emit channel so cable pulse fires on fetched value - node fetches on trigger (1) - doesn't sub to routeSend
          const list = splitWords(this.getAttribute('data-scv-emits'));
          if (!list.includes(ch)) list.push(ch);
          this.setAttribute('data-scv-emits', list.join(' '));
          onRegister(this);
        }
        this._questChannel = ch;
        if (scrapeMode && parsed.url) {
          this._hadScrape = true;
          quests.registerScrape(parsed).catch(() => { // a transient outage at configure time must not leave node registered-never - retry until it lands or the node moves on
            const retry = () => {
              if (this._questChannel !== ch || !this._hadScrape) return; // reconfigured or detached meanwhile
              quests.registerScrape(parsed).catch(() => setTimeout(retry, 2000));
            };
            setTimeout(retry, 2000);
          });
        } else {
          this._hadScrape = false;
        }
        if (inMode) this._pollCancel = quests.pollValue(ch, _showFetched, msg => this._showFloat(msg));
        else if (compMode) { // live component auto-refreshes - re-fetch on interval; showComponent dedups on hash so unchanged poll never re-renders
          this._adoptLive(); // reload: bind to exported component (offline last-state) so first poll morphs in place, not duplicate
          let stopped = false, ct;
          const tick = () => {
            if (stopped || this._questChannel !== ch) return;
            quests.fetchValue(ch).then(v => { if (!stopped && this._questChannel === ch) showComponent(v); })
              .catch(err => { if (!stopped) this._showFloat(quests.waitingMessage(err)); }) // same warn/error wording input node shows
              .then(() => { if (!stopped) ct = setTimeout(tick, 2000); });
          };
          tick();
          this._pollCancel = () => { stopped = true; clearTimeout(ct); };
        }
      };

      icon.addEventListener('click', e => {
        e.stopPropagation();
        if (this._questChannel) { // clean up old mode's registration before switching
          if (this._hadScrape && !_questChannelStillNeeded(this._questChannel, this)) {
            quests.releaseChannel(this._questChannel);
          }
          cleanupWiring();
        }
        this._questChannel = null;
        this._hadScrape = false;
        this._questMode = this._questMode === 'input' ? 'output' : this._questMode === 'output' ? 'component' : 'input'; // input > output > component > input
        this._unmountLive?.(); // leaving component mode drops spawned component
        applyMode();
        applyCfg();
      });

      this.addEventListener('scv-receive', e => {
        if (this._questMode === 'input' || this._questMode === 'component') {
          if (e.detail == 1 && !this._fetching) { // trigger on received 1 and fetch latest value / component
            this._fetching = true;
            const fetchCh = this._questChannel;
            quests.fetchValue(fetchCh).then(val => {
              if (this._questChannel !== fetchCh) return; // reconfiguration mid-flight must not act on stale channel
              this._questMode === 'component' ? showComponent(val) : _showFetched(val);
            }).catch(() => {}).then(() => {
              this._fetching = false;
            });
          }
        } else if (this._questChannel) { // output mode: write cable inputs to server channel
          quests.emitValue(this._questChannel, e.detail);
        }
      });

      let bootTimer;
      input.addEventListener('change', applyCfg); // commit on blur - keystrokes never re-register scrape or restart poll
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); applyCfg(); } });

      this._reconnect = () => { if (this._questMode === 'input' || this._questMode === 'component') applyCfg(); }; // connectedCallback re-runs this to re-register scrape (re-fetches + re-mounts)
      this._disconnect = () => { // cancels polling so a removed node can't keep fetching - drops scrape unless another node still displays it
        clearTimeout(bootTimer); // same for initial boot config
        unmountLive(); // removed component node takes rendered component and position observer with it
        this._pollCancel?.(); this._pollCancel = null;
        if (this._questChannel && window.__QUEST_API__ && this._hadScrape && !_questChannelStillNeeded(this._questChannel, this)) {
          quests.releaseChannel(this._questChannel);
        }
        this._questChannel = null; this._hadScrape = false; // detach: registration retries and poll loops keyed off these must stop
      };
      applyMode();
      bootTimer = setTimeout(applyCfg, 100);
    }
